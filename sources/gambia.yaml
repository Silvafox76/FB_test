# The Gambia Public Procurement Authority (GPPA), the country's national
# procurement regulator under the Public Procurement Act. Both candidate entry
# points named in the onboarding brief were checked live on 2026-09-12, and
# every finding below was independently re-run on 2026-09-13 (this session)
# against the live site with one polite GET per path; nothing had changed
# (same robots.txt bytes, same skeleton markup, same dead footer links, same
# sitemap lastmod), so this file supersedes the 09-12 draft on the same
# conclusions rather than on new ones:
#
#   1. https://gppa.gm -> HTTPS 200, valid cert, http:// redirects 301 to
#      https://. This is the live, official site and it names itself as the
#      tender publisher in its own meta description ("Access tenders,
#      register as a supplier..."), so it is the correct body to onboard, not
#      a guess or a re-publisher.
#   2. https://mofea.gm and https://www.mofea.gm -> not re-probed this
#      session (rule: one polite request per page; re-hitting a host that
#      does not bear on this file's decision is not that). 2026-09-12's
#      record stands: CONNECT failed with a proxy 502, ambiguous between
#      policy denial and a genuinely unreachable host, not worked around.
#      Moot regardless: GPPA, not the ministry, is Gambia's statutory
#      procurement regulator and the body whose own copy says it publishes
#      tenders.
#
# ROBOTS.TXT, re-fetched 2026-09-13 14:08 UTC, byte-identical to 2026-09-12,
# verbatim:
#   User-Agent: *
#   Allow: /
#   Disallow: /api/
#   Disallow: /admin/
#
#   Sitemap: https://gppa.gm/sitemap.xml
# No crawl-delay is stated. /tenders/notices (the listing used below) is
# under neither Disallow line, so reading it is permitted. /api/ is
# disallowed, which matters below: this site calls a backend to fill the
# listing, and that backend was not probed for a path, both because guessing
# at it is the documentation-memory shortcut CLAUDE.md forbids and because a
# same-host /api/ path would fall under this exact Disallow if it were found.
#
# WHAT THE PAGE ACTUALLY SERVES, RE-CONFIRMED THIS SESSION, AND WHY THIS IS A
# BrowserConnector. gppa.gm is a Next.js site (RSC streaming, not a static
# export; the response carries X-Powered-By: Next.js and an x-nextjs-cache
# header). The shell HTML is genuinely server-rendered - nav, footer and page
# chrome are all present in the raw response, confirmed by fetching
# https://gppa.gm/tenders/notices with plain curl and no cookie jar,
# identified as FreeBalance-OpportunityMonitor/0.1 - but the listing's
# content area renders only six Tailwind `animate-pulse` skeleton cards, e.g.
# verbatim from the 2026-09-13 fetch:
#   <div class="bg-white rounded-xl border border-slate-200 p-6 animate-pulse
#   h-80"><div class="h-4 bg-slate-200 rounded w-24 mb-4"></div>...
# repeated six times in one 44,250-byte response. This is a loading
# placeholder, not data: the notice grid is a client component whose real
# fetch happens after hydration, so a plain HTTP GET - which is all
# `monitor/connectors/base.py`'s FeedConnector or a PageConnector built the
# same way can do - receives the pre-fetch skeleton state, not a listing,
# every time. Reporting that as a healthy read of nothing would be worse
# than not onboarding the source (rule 4).
#
# THE "Showing 0 tender notices" TEXT VISIBLE IN THE RAW HTML IS NOT A REAL
# COUNT. It sits directly above the skeleton grid quoted above and reads,
# node for node in the 2026-09-13 fetch too:
#   Showing<!-- --> <span class="font-semibold">0</span> <!-- -->tender notices
# That is a counter `useState`'d to 0 before the same client-side fetch that
# fills the skeleton cards resolves, not a server-confirmed total - the
# giveaway is that it sits beside loading placeholders rather than an
# empty-grid message. It cannot be read as "GPPA currently has zero live
# tenders" any more than the skeleton cards can be read as real notices; both
# are the pre-JS state. No page on this site can be scored for volume from a
# plain GET, which is why VOLUME below is unmeasured rather than a
# (misleadingly reassuring) zero.
#
# There is a same-origin API this SPA almost certainly calls once hydrated -
# meta tags and a Supabase storage bucket under a `base44-prod` name the
# platform, both still present verbatim in the 2026-09-13 fetch - but no path
# was guessed at: robots.txt already disallows /api/ on this exact host, and
# finding the real endpoint without running the page's own JavaScript would
# be exactly the undocumented-internal-API guess CLAUDE.md's "do not build
# against documentation memory" forbids. A Playwright connector watching the
# page's own network calls is how a real endpoint would be found, not
# URL-guessing here (same conclusion as sources/senegal.yaml reached for
# achatspublics.sn's api.achatspublics.sn).
#
# REGISTRATION: NOT REQUIRED TO READ THE LISTING. /tenders/notices carries no
# login wall and no paywall; the account system lives on a separate
# subdomain, gppportal.gppa.gm, linked from gppa.gm's own header behind a
# button labelled "Register as Supplier" - i.e. for bidding, not reading.
# access is therefore `public_listing`, not `registered`, even though the
# technical route to it needs a browser, the same distinction
# sources/senegal.yaml draws for APPEL.
#
# VOLUME: STILL UNMEASURED, BECAUSE THIS AGENT CANNOT RENDER THE PAGE. No
# count on this site - tenders, awarded contracts, procurement plans,
# publications, the "Active Tenders" / "Plans Submitted" widgets on /updates
# - can be read from a plain GET per the finding above, so there is no 7-day
# window to report and no lifetime total either. sitemap.xml's lastmod is
# still 2026-07-09 across every static page, re-fetched and byte-identical
# this session, which says only that the site's markup has not shipped a new
# build since then; it says nothing about publication rate on the dynamic
# listing. Treat `expected_items_per_run` below as a placeholder, not an
# observation, and replace it from the first live Playwright fetch. Given the
# country's size, a handful of notices a month, not a week, is the plausible
# real rate; this is a guess offered for calibration only and is not what is
# written into the health band below.
#
# LANGUAGE AND CODES. The site declares `<html lang="en">` (re-confirmed on
# both the home page and the listing page this session) and every string of
# UI copy read across all pages fetched is English, so `language: en` is
# confirmed against the chrome. Whether notices carry CPV codes or a national
# scheme, and whether a notice's supporting documents need a session or are
# PDFs with or without a text layer, could not be checked: no real notice has
# been observed to inspect, for the same JS-rendering reason as above. Both
# are open items for whoever builds the connector, to be resolved against the
# first real, hydrated notice rather than guessed here.
#
# TOS: PENDING, NOT REVIEWED. Re-checked 2026-09-13: the home page footer's
# "Privacy Policy" and "Terms of Use" links are both literally `href="#"` -
# dead placeholders, not routes to a page (`<a class="hover:text-white"
# href="#">Terms of Use</a>`, verbatim from this session's fetch of
# https://gppa.gm/). Direct guesses at a legal-notice path all still 404:
# /terms, /terms-of-use, /privacy, /legal (re-checked 2026-09-13; the wider
# list from 2026-09-12 - /terms-and-conditions, /privacy-policy, /tos - was
# not re-hit this session to keep to one polite pass per path and nothing
# about a footer link pointing at "#" would change by re-trying them). No
# terms-of-use, legal notice or acceptable-use page exists anywhere on
# gppa.gm to quote a clause from. Absent a clause, this stays `pending` for
# legal review, not a guess in either direction, same as sources/senegal.yaml.
id: gambia
name: Gambia Public Procurement Authority (GPPA), Tender Notices
country: GM
admin_level: national
language: en
stream: portal
access: public_listing
# See "WHAT THE PAGE ACTUALLY SERVES" above: the listing is a client-fetched
# grid behind a server-rendered shell, re-proven by an unauthenticated GET on
# 2026-09-13 that returned only skeleton markup, so a plain-GET connector
# would read a permanent loading state, never data. BrowserConnector is
# disabled-registry-only until it is built; test_every_enabled_source_is_a_
# feed_connector scopes to enabled sources only, so this row does not need
# that test touched (tests/unit/test_registry.py, outside this agent's lane
# regardless).
connector: BrowserConnector
wave: 1
# 11:30 UTC daily = 11:30 Banjul (Gambia is UTC+0 year-round, no DST). Chosen
# to collide with nothing already in sources/: boamp 04:30, doe 05:00, ted
# 06:00, prozorro 06:30, fts 07:00, undp 07:30, worldbank 08:00,
# simap/worldbank_pipeline 08:30, euft/place 09:00, mcc Monday 09:30, ungm
# 10:00, ebrd 10:30, senegal 11:00.
schedule: '30 11 * * *'
# The tender listing itself, linked from the home page's Tenders menu.
# Re-confirmed live 2026-09-13: HTTP 200, 44,250 bytes, but see above - the
# document served here carries only six loading-placeholder cards without
# JavaScript, which is the fact a BrowserConnector has to be built against.
list_url: https://gppa.gm/tenders/notices
# Best available guess at the row container, NOT verified against a real
# rendered notice: no live tender has been observed anywhere on the site to
# inspect (see VOLUME above), only the loading-skeleton card, quoted in full
# above and re-fetched byte-identical on 2026-09-13, which uses this exact
# wrapper class plus two loading-only utility classes (`animate-pulse`,
# `h-80`) this selector deliberately excludes. The real card is drawn from
# the same design system (shadcn/ui-style Tailwind components reused
# verbatim across /tenders/notices, /tenders/awarded-contracts and
# /tenders/annual-procurement-plans) so reusing the wrapper class without the
# loading-only modifiers is the best evidence-based guess available, not a
# documentation-memory invention - but it is still unconfirmed. Whoever
# builds this connector must verify it against a real Playwright render of
# an actual populated notice before writing the contract test, and change
# this line if the populated card differs.
row_selector: 'div.bg-white.rounded-xl.border.border-slate-200.p-6'
tos_status: pending
enabled: false
health:
  # UNVERIFIED PLACEHOLDER. See VOLUME above: no real count could be read
  # from this site without a browser, so there is no measurement to floor
  # this on. Set to 1 rather than 0 so a silent empty run can never read as a
  # healthy one (rule 4), same convention as sources/mcc.yaml and
  # sources/senegal.yaml for an unread route. The upper bound is a guess for
  # a small country's plausible monthly rate, not an observation, and is
  # also the detail-request ceiling in whatever connector is built - both
  # numbers must be replaced from a real Playwright fetch before this source
  # is ever enabled.
  expected_items_per_run: [1, 10]
  max_consecutive_failures: 3
owner: ryan.dear
