#     timestamp, not the date of the latest notice, and "tag":["tender",
#     "award"] is printed on every release regardless of whether "award" is
#     actually populated (it was empty, [], on every release checked) - a
#     connector must read the award array itself, not trust the tag.
#   RECOMMENDATION FOR THE CONNECTOR: use krppAPI/Tender (flat JSON), not
#   krppAPI/TenderRelease (OCDS envelope), as the operative endpoint. They
#   carry the same underlying tender set (cross-checked above) and rule 9 does
#   not require the literal OCDS envelope to be preserved as the stored
#   record, only that the original text is kept - Tender's own title/
#   description fields are that original text either way. TenderRelease's
#   multi-minute response time for an equivalent query is a real operational
#   cost the flat endpoint does not carry, for no field this pipeline needs
#   that isn't already on the flat record.
#   ACQUISITION SCOPE, NOW BY ENDPOINT NOT BY STRING MATCH: krppAPI/Tender and
#   krppAPI/TenderRelease are themselves the pre-award listing - award
#   decisions live in the separate krppAPI/Award endpoint, bid data in
