#     tenderPeriod.startDate of 2026-06-16 to 2026-09-18), wrapped in a
#     genuine OCDS 1.1 release package: {"publisher":{"name":"Kosovo: Public
#     Procurement Regulatory Commission (PPRC)"},"version":"1.1",
