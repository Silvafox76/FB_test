# "documents" array does not reference a PDF at all - every document object
# sampled (301 of 301) has "format":"text/html" and a "url" pointing back to
# the same DokumentPodaciFrm.aspx?id=... detail page the original assessment
# already found returns HTML, not a PDF, on a plain GET. The unresolved
# "does the tender-document PDF carry a text layer" question from the original
# assessment does not apply to this route: there is no PDF reference to
# follow, only a link back to the HTML page already read.
#
# CPV: NOT CARRIED BY EITHER API ENDPOINT. Both krppAPI/Tender's and
# krppAPI/TenderRelease's `tender.items` array was empty ([]) on every one of
# the 301 releases checked, and neither payload contains the string "cpv"
# anywhere (checked case-insensitively against the full response). This is a
# real trade-off, not a wash: the ORIGINAL assessment's search grid
# (PreglediFrm.aspx?method=ReducedObjavljeniDokumenti, its own "FPP" column)
# remains the only place CPV was found on this platform, and it was already
# not the chosen list_url even under the HTML route. A connector wanting CPV
# per notice still needs that separate grid page regardless of which route
# (API or digest) supplies the base notice feed - this is an existing gap the
# API neither closes nor widens.
#
# LANGUAGE: sq confirmed again, this time from the API's own structured field
# rather than inferred from page text - every "documents[].language" value
# read across 301 releases was "sq", with no other value seen.
#
# VOLUME AND RECENCY, measured 2026-09-19 against krppAPI/Tender with
# endDateFrom=2026-09-19&endDateEnd=2026-10-19 (one call): 301 currently-open
# tenders, tenderPeriod.startDate ranging 2026-06-16 to 2026-09-18 - i.e. the
# most recent publication in this snapshot is ONE DAY before this assessment
# (today is 2026-09-19), not stale. Of those 301, 263 have a startDate within
# the last 30 calendar days (2026-08-20 to 2026-09-19). THIS IS A PROXY, NOT
# AN EXACT 30-DAY PUBLICATION COUNT, SAID PLAINLY RATHER THAN LEFT LOOKING
# MORE PRECISE THAN IT IS: because the API has no start-date filter (see
# WINDOWING above), this count is bounded to tenders that are BOTH published
# in the last 30 days AND still open with a deadline inside the next 30 days -
# a tender published 25 days ago with a typical ~20-day bidding period would
# already show a past deadline and be excluded from this pull entirely, so 263
# understates true 30-day publication volume. It is, however, the right order
# of magnitude: the original assessment's direct daily count from the HTML
# digest (114 new B05 Contract Notices over 5 business days, 2026-09-05 to
# -11, daily counts 21,25,18,23,27) implies roughly 16 new tenders per
# calendar day once weekends are folded in, and at a typical ~20-day open
# period that predicts on the order of 300 tenders open at any snapshot -
# matching the 301 measured here almost exactly. The two routes corroborate
# rather than contradict each other; the health thresholds below are left as
# originally set on the digest's own direct daily count, which remains the
# more precise of the two measurements, rather than replaced with this looser
# API proxy.
# ============================================================================
id: kosovo
name: KRPP OCDS API (Kosovo National Public Procurement, Tender releases; e-Prokurimi is the same platform's HTML front end)
country: XK
admin_level: national
language: sq
stream: feed
wave: 2
access: api
connector: FeedConnector
# 12:30 UTC daily = 14:30 in Kosovo (Europe/Belgrade zone; Kosovo has no separate
# IANA tz entry and uses the same UTC+2/CEST-in-September offset as Serbia,
# Montenegro and North Macedonia). Chosen to collide with nothing already in
# sources/ (boamp 04:30, doe 05:00, ted 06:00, prozorro 06:30, fts 07:00, undp
# 07:30, worldbank 08:00, simap and worldbank_pipeline 08:30, euft and place 09:00,
# mcc Monday 09:30, ungm 10:00, ebrd 10:30, benin/cote_divoire/liberia/senegal/
# sierra_leone 11:00, gambia/mali/nigeria 11:30, ghana 12:00). Afternoon rather than
# morning because a full business day's postings only settle once the portal's own
# working day closes, true of the API's own publish rhythm the same way it was true
# of the digest (see VOLUME AND RECENCY, 2026-09-19, above); unchanged by the
# 2026-09-19 route re-assessment since the underlying platform's posting rhythm,
# not the route, sets this.
schedule: '30 12 * * *'
api_url: https://ocdskrpp.rks-gov.net/krppAPI/Tender   # flat JSON, not krppAPI/TenderRelease (OCDS envelope) - see RECOMMENDATION FOR THE CONNECTOR, 2026-09-19, above: same underlying tenders, minutes faster
tos_status: pending          # re-assessed 2026-09-19: neither an open licence nor an inherited PPRC ToU clause 28(c) - see NET LEGAL POSITION above for what legal needs to decide now
enabled: false          # step 25 not yet built; also blocked on legal clearing tos_status pending (see NET LEGAL POSITION, 2026-09-19, above) before any live fetch
# exclude_notice_types removed 2026-09-19: acquisition scope is now by endpoint
# choice (krppAPI/Tender and krppAPI/TenderRelease are pre-award only; award data
# lives in the separate krppAPI/Award endpoint), not by string-matching the HTML
# digest's five type headers. See ACQUISITION SCOPE, NOW BY ENDPOINT NOT BY STRING
# MATCH, 2026-09-19, above.
health:
  # KEPT (pre-award tender) counts, corroborated on two independent measurements
  # against the same underlying platform: the original 2026-09-12 HTML-digest count
  # (226 B05 Contract Notices over ten business days, daily counts
  # 26,16,17,24,29,21,25,18,23,27; never zero on a posting day) and the 2026-09-19
  # API count (301 currently-open tenders via krppAPI/Tender, consistent with the
  # digest's own daily rate at a ~20-day typical bidding period - see VOLUME AND
  # RECENCY above). Bounds below are left as originally set on the digest's more
  # precise direct daily count rather than replaced by the looser API proxy. Floor
  # set well below the observed ten-day total to allow for a quiet stretch (the
  # lowest single day measured was 16), ceiling with headroom for a busier one;
  # both remain a snapshot measurement, not a rolling-window statistic, and should
  # be replaced once a connector has real run history, the same caveat
  # sources/sierra_leone.yaml records for its own single-day count.
  expected_items_per_run: [80, 500]
  max_consecutive_failures: 3
owner: ryan.dear
