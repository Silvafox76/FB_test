#      service call) rather than linking a static file. A full (non-AJAX) postback
#      replaying that button's `__EVENTTARGET` with the page's own ViewState and the
#      session cookie from the same GET returned another full HTML page, not a PDF -
#      the popup's real content is fetched by client-side script the postback alone
#      does not trigger. UNRESOLVED, and recorded rather than guessed at: whether
