#   2. https://krpp.rks-gov.net/ (KRPP, Komisioni Rregullativ i Prokurimit Publik /
#      Public Procurement Regulatory Commission) - RESOLVES (same two addresses as
#      AQP), but every request - robots.txt and the home page, tried once each, then
#      the home page retried once to rule out a transient blip - answered
#      `HTTP/1.1 200 Connection Established` (the CONNECT tunnel to the real origin
#      succeeded) followed by a full `HTTP/1.1 502 Bad Gateway` WITH
#      `Server: Microsoft-IIS/10.0`, a `Content-Length` and a complete IIS error
#      page body. That is a real answer from a real IIS server acting as a reverse
#      proxy to a dead upstream, not the proxy's own ambiguous
#      "gateway answered 502 to CONNECT" failure sources/senegal.yaml and
#      sources/sierra_leone.yaml record for hosts that never got past the tunnel -
#      the two are distinguishable here and this is the distinguishable one: the
#      host is up, IIS is up, and whatever KRPP intends to serve on this domain is
#      down behind it. Not pursued further because of (3).
#   3. https://e-prokurimi.rks-gov.net/ - RESOLVES to a third address
#      (2a07:e0c0:3:1::80 / 2a07:e0c0:4:1::80, same government /64 blocks as (1) and
#      (2) but its own host), ANSWERS 200 (redirect chain 301 -> 301 -> 302 -> 200,
#      all same-host, to /HOME/ClanakItemNew.aspx?id=327), and is named on its own
#      home page and in its own Terms of Use (quoted below) as owned, operated and
#      administered by KRPP. THIS SOURCE. KRPP's own welcome text: "Mire se vini ne
#      faqen zyrtare te internetit te Prokurimit Publik te Kosoves e cila eshte e
#      krijuar si Portal i Prokurimit Publik" (Welcome to the official website of
#      Kosovo Public Procurement, created as the Public Procurement Portal), citing
#      Law No. 04/L-042 as KRPP's mandate to run it. The nav links both AQP and OSHP
#      (the review body) as related but separate institutions, confirming this is
#      the one shared platform, not one of several.
#
# ROBOTS.TXT:
#   - https://e-prokurimi.rks-gov.net/robots.txt -> HTTP 404 (real IIS "File or
#     directory not found" page, not a proxy failure), i.e. no robots.txt exists.
#     Nothing is disallowed because there is no file to disallow anything, the same
#     absence-means-permitted reading sources/doe.yaml and sources/cote_divoire.yaml
#     record for their own 404s. No crawl-delay is stated anywhere.
#   - https://aqp.rks-gov.net/robots.txt -> HTTP 200, verbatim:
#         User-agent: *
#         Disallow: /wp-admin/
#         Allow: /wp-admin/admin-ajax.php
#     Moot for this file (AQP is not the source) but recorded since it was fetched.
#   - https://krpp.rks-gov.net/robots.txt -> HTTP 502 (see host 2 above); could not
#     be read. Moot for the same reason.
#
# TERMS OF USE, FOUND AND READ. Linked from e-prokurimi's own footer as "Termat dhe
# Kushtet": https://e-prokurimi.rks-gov.net/Home/Manuals//TermsAndConditions/KushtetDheTermatE-prokurimi.pdf
# ("Kushtet dhe Termat per Perdorimin e Sistemit te Prokurimit Elektronik - Marreveshja
# e Perdoruesit", i.e. Terms and Conditions for Use of the Electronic Procurement
# System - User Agreement), fetched cold with no session, HTTP 200, a genuine
# 16-page text-layer PDF (pdftotext -layout recovered 46,510 characters of real
# prose, not a scan). Trilingual, Albanian/English/Serbian in parallel columns, each
# language numbered independently within its own block; citations below use the
# English-block clause numbers.
#
#   - REGISTRATION IS FOR BIDDING, NOT FOR READING. Clause 3 (Albanian block; "User
#     account (Registration) will be created only once the terms and conditions...
#     have been read and accepted") and clause 24 ("Users' credentials": a username
#     and password from "Registration of new users" are what let an Economic
#     Operator submit a bid) both tie the account to placing a tender, not to seeing
#     one. This matches what was measured directly: every notice-listing and
#     notice-detail page below returned real data on a first, unauthenticated GET,
#     with only an anonymous ASP.NET_SessionId and no redirect to a login page. So
#     BUILD_ORDER step 25's "behind registration" does not hold for the read this
#     source needs; it holds for the bidding half of the platform, which this
#     source does not touch.
#   - CLAUSE 23 (Security) states plainly that "Access to the e-procurement system is
#     provided on the initiative of the user and not on the initiative of PPRC" and
#     prohibits attacks on the system (defeating security features, forged headers,
#     DoS) - nothing there reaches ordinary reading of a public listing.
#   - CLAUSE 22 (User conduct) bans transmitting "computer viruses, trojan horses
#     worms, bots... or other destructive computer code" - this is about not
#     attacking the system with malicious payloads, not a ban on automated reading;
#     "bots" appears in a list with viruses and worms, not as its own clause.
#   - CLAUSE 28 (Copyright) IS A REAL RESTRICTION AND IS WHY THIS FILE IS NOT
#     reviewed_ok. 28(a): the system is owned/operated/administered by PPRC (KRPP).
#     28(b): all content - "trademarks, distinctive titles, texts, news,
#     photographs, images" - is PPRC's property. 28(c), quoted in full because it is
#     the clause that matters: "No user may copy, modify, publish, transmit,
#     transfer or sell, reproduce, create derivative works from, distribute,
#     display, or in any way exploit any of the content, in whole or in part,
#     except for i) where this is permitted by public procurement laws and
#     regulations of the Republic of Kosovo, or ii) with the express written
#     agreement of PPRC." This pipeline stores notice text, sends it to a model,
#     derives an English rendering and exports a row to a CRM staging file - that is
#     copying and reproducing "content" in the plain meaning of 28(c), and whether
#     it falls inside exception (i) (Kosovo's public procurement law plainly
#     contemplates public awareness of published notices; whether it stretches to
#     what this pipeline does with them is a legal reading, not an engineering one)
#     is exactly the kind of question this step is not supposed to guess at.
#     Nothing here bans automated *access* or scraping in so many words - there is
#     no robots.txt disallow, no "no crawling" clause, no rate-limit statement - so
#     this is not the clean reviewed_restricted stop CLAUDE.md describes for an
#     outright prohibition. It is also not reviewed_ok: a specific reproduction
#     restriction was found and read, and applying it to this pipeline's own
#     processing is a legal judgment call.
