# ACCESS ROUTE. In the order this pilot works down: no documented API; e-prokurimi's
# own shipped JavaScript was read rather than assumed inert, the same check that
# turned sources/senegal.yaml and (per BUILD_ORDER step 25's own prior wave) Mali
# into FeedConnectors reading a JSON endpoint instead of a browser - and it found
# nothing to reproduce here. This is not a single-page-application: the app is
# classic ASP.NET WebForms (SPIN_PROD, the "Idom3"/SPIN e-procurement product family
# also seen elsewhere in the Balkans), server-side ViewState and postbacks, no
# client-side router, no fetch/XHR call to a JSON API anywhere in its script tags.
# No RSS or ATOM link in any page `<head>`. No alert-email subscription found. What
# is there is a public HTML listing, confirmed live with a plain `curl` (no browser,
# no JS engine) against three pages, none of which needed a session beyond the
# anonymous one IIS hands out to any visitor:
#
#   1. THE NOTICE DIGEST (this source's list_url):
#      https://e-prokurimi.rks-gov.net/SPIN_PROD/application/ipn/DocumentManagement/NewPreglediDokumenataFrm.aspx
#      One GET, HTTP 200, 2.27 MB of server-rendered HTML, "Lista e njoftimeve te
#      publikuara" (List of published notices): every notice from the ten most
#      recent PUBLICATION DAYS - measured as exactly two Monday-to-Friday business
#      weeks, 2026-08-31 through 2026-09-11, with no weekend dates present at all,
#      consistent with the portal simply not publishing on weekends rather than the
#      window being date-bounded by a query - grouped by day and by notice type,
#      each entry numbered and titled. No pagination control exists on this page (no
#      "next", "more" or page-number link; the page's own final visible line is
#      "Kthehu ne fillim te faqes", back to top). This is the same shape
#      sources/ebrd.yaml and sources/sierra_leone.yaml both chose FeedConnector for:
#      one fixed URL, one document, no browser, no query parameters submitted, no
#      pagination to walk.
#   2. THE STRUCTURED SEARCH GRID (a better source for per-notice fields, recorded
#      for the connector builder rather than made the operative URL):
#      https://e-prokurimi.rks-gov.net/SPIN_PROD/application/ipn/PreglediFrm.aspx?method=ReducedObjavljeniDokumenti
#      A GET (one redirect to a session-scoped SearchFrm.aspx, then 200) rendered a
#      populated ASP.NET GridView with NO search terms filled in and NO button
#      clicked - the grid's own decoded ViewState states "Numri i pergjithshem te
#      dhenave te cilat i plotesojne kriteret e kerkimit: 216833" (216,833 total
#      records matching the search - i.e. no filter - criteria), sorted descending
#      by "Data e publikimit" (a real server-side column sort with a visible sort
#      arrow, not client-side DataTables the way sources/ebrd.yaml's ECEPP sorts).
#      Its 20-row-per-page grid carries what the digest does not: Numrin e
#      prokurimit (procurement number), Autoriteti kontraktues (contracting
#      authority), Numri i publikimit (a composite id that embeds the notice-type
#      code, e.g. "2026/KEK-26-2373-1-2-1/B08-0019520"), Lenda e prokurimit / grupi
#      (subject), FPP (CPV - see CODES below), Lloji i kontrates (contract type),
#      Vlera e kontrates (value tier), Procedura, Data e publikimit, Ri-Tenderim,
#      Ankand. Reaching page 2 needs an ASP.NET postback (a POST replaying
#      __VIEWSTATE/__EVENTTARGET, standard for this framework and not a JavaScript
#      requirement - httpx can do it, no Playwright needed) rather than a second GET,
#      which is real added complexity left to the connector builder rather than
#      solved here; it is not evaluated as this source's default read for that
#      reason, but a connector wanting CPV per notice without opening a detail page
#      should read this grid rather than the digest.
#   3. A SPECIFIC NOTICE'S DETAIL PAGE, e.g.
#      https://e-prokurimi.rks-gov.net/SPIN_PROD/application/ipn/DocumentManagement/DokumentPodaciFrm.aspx?id=4280846
#      linked directly from every digest row - GET, HTTP 200, no login. This is
#      where DOCUMENT DOWNLOAD WAS TESTED AND DID NOT RESOLVE CLEANLY: the "Dokument
#      PDF" control is wired to `WebForm_DoPostBackWithOptions`, which on inspection
