# Kosovo's central public procurement platform, BUILD_ORDER step 25 ("Balkan
# portals are BrowserConnector, behind registration"). That assumption is checked
# rather than carried forward, and for this source it does not hold on either half:
# the notice listing needs no registration and needs no browser. Both findings are
# measured below, not asserted.
#
