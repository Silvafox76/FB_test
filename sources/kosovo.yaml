# CODES: CPV IS CARRIED, under Kosovo's own name for it. The search grid's "FPP"
# column ("Fjalori i Perbashkuar i Prokurimit", Kosovo's rendering of the EU Common
# Procurement Vocabulary) held standard 8-digit-plus-check-digit CPV codes on every
# row read (31110000-0, 45000000-7). The legal-classification submenu on the portal
# itself also lists "FPP" and "FPP - suplementar" as browsable code lists, confirming
# this is the real CPV scheme and not a lookalike. The plain digest view (route 1
# above) does not carry CPV inline; only the search grid (route 2) does.
#
# ACQUISITION SCOPE: the digest's own type headers separate a Contract Notice (a new
# tender) from four notice types that are all post-decision, the same query-time
# separation sources/doe.yaml and sources/ebrd.yaml both make and for the same
# reason - nothing is read as an opportunity and then thrown away, because these are
# never opportunities. Unlike DOE's eForms formType or EBRD's own notice-type
# string, there is no query parameter to ask for one type only here: the digest
# mixes all five under one URL, so the split happens while parsing the one document
# already fetched, not before fetching it - recorded here rather than left for a
# connector to discover, since CLAUDE.md rule 6 puts this classification in the
# registry. Measured 2026-09-12 counting numbered entries under each type header
# across the ten dates the digest shows (2026-08-31 to 2026-09-11):
#
#   KEPT:    B05 Njoftim per Kontrat (Contract Notice - a new tender) - daily counts
#            26, 16, 17, 24, 29, 21, 25, 18, 23, 27 across the ten dates in order,
#            226 total over the ten-business-day window; never zero on a posting day.
#   EXCLUDED (post-decision, all named exactly as the portal prints them so a typo
#   here cannot silently exclude nothing - see exclude_notice_types):
#     - B08 Njoftim per dhenie te kontrates (Contract award notice) - 331 over the
#       same window, the single largest type.
#     - B52 Njoftimi per nenshkrimin e kontrates (Notice of contract signing) - 282.
#     - B10 Njoftimi per anulimin e aktivitetit te prokurimit (Cancellation of a
#       procurement activity) - 108.
#     - B11 Njoftimi per anulimin e dhenies se kontrates (Cancellation of a contract
#       award) - 1, seen on a single date.
#   These labels were read from the digest's own headers and not independently
#   cross-checked against a documented Kosovo notice-type list, the one honest gap
#   in this classification; the connector should raise (per sources/ebrd.yaml's
#   discipline) if any of the four excluded strings ever fails to match a header on
#   the live page, rather than silently keep matching nothing.
#
# VOLUME, measured 2026-09-12, KEPT (B05) NOTICES ONLY, for the last 7 CALENDAR days
# (2026-09-05 to 2026-09-11 - two of those seven are the weekend, on which nothing
# publishes): 07-09 21, 08-09 25, 09-09 18, 10-09 23, 11-09 27 = 114 new Contract
# Notices in 5 posting days. This is a real national volume, not a token connector -
# an order of magnitude above every West African source in this registry, and it is
# the whole of Kosovo's public procurement (central ministries, municipalities such
# as Komuna e Gjilanit, and state-owned enterprises such as KEK and Termokos all
# post to the one platform), not one agency's slice of it.
#
