# Ghana's national public procurement publication route, RE-ASSESSED 2026-09-13
# from the position sources/ghana.yaml recorded on 2026-09-12 (that session's own
# text is quoted below where it matters), because that session ended with three
# candidate hosts and none of them confirmed readable. This session had a working
# egress path to two of the three and got a different, better answer for one of
# them. Ghana still matters more than its volume: the Ghana GIFMIS Modernisation
# CRM record Architecture v0.4 appendix E is built from names this country, and
# this is the one West African source with a known real PFM buyer already in the
# pipeline the pilot exports to.
#
# THE ANSWER THIS SESSION MEASURED: GHANEPS's own "Current Tenders" search,
# https://www.ghaneps.gov.gh/epps/quickSearchAction.do?searchSelect=6, returns a
# real, populated results table - 69 open tenders, page 1 of 7, title/buyer/
# deadline/publication-date columns all present - to a single anonymous GET with
# no cookie jar, no login, and no JavaScript executed (fetched with plain curl).
# Reproduced twice, twelve minutes apart, byte-identical (34,708 bytes both
# times). This directly contradicts the 2026-09-12 file's own GHANEPS finding
# ("an anonymous, single GET to every listing action this portal publishes
# returns no tender data"), which was based on the same URL 302-redirecting to
# the home page on that session's attempts. Both findings are kept on the
# record rather than the earlier one being erased: something about that
# session's request, or the app's own state at that moment, produced a
# redirect; this session's request, tried twice, did not. Whoever operates this
# connector should treat an occasional redirect-to-home as a possible transient
# state to retry within the run (source-declared retry, rule 2) rather than a
# hard wall, now that a clean anonymous 200 is proven to be the normal case.
#
# HOSTS CHECKED, IN CLAUDE.md's OWN ORDER (documented API / structured feed
# before any HTML listing), 2026-09-13:
#
#   1. GHANEPS's OCDS Visualisation app, linked from GHANEPS's own home page as
#      "Access to Liberia OCDS portal"'s Ghanaian counterpart
#      (https://www.ghaneps.gov.gh/ocds/report/home.action#/home) - checked
#      FIRST, ahead of the HTML listing, because sources/liberia.yaml found
#      exactly this app, on the same European Dynamics product family, backing
#      a real documented JSON records API (`POST /ocds/record/searchRecords.
#      action`). Ghana ships the identical Angular app (same file layout,
#      /ocds/js/custom/controllers/RecordGridCtrl.js names the same
#      `contextPath + '/record/searchRecords.action'` URL and the same
#      `{page, pagesize, sortField, sortDir}` body shape, read directly from
#      the served JS rather than assumed from Liberia's fixture). The endpoint
#      exists and answers - it is not a 404 - but it returns HTTP 500 with a
#      generic `Server Encountered An Unexpected Condition` error page on every
#      body shape tried (the exact `{page:1,pagesize:5,sortField:"",
#      sortDir:""}` request that works today against Liberia's instance;
#      page/pagesize alone; explicit nulls for the sort fields) - three
#      attempts, all 500, so this is not a request-shape guess that happened to
#      be wrong, it is a backend that errors on this specific Ghana deployment.
#      NOT THIS SOURCE: a documented feed that 500s on every call is not a
#      working route (procedure step 3 says stop at the first route that
#      *works*), and rule 1 forbids maintaining a second entry point once one
#      is chosen, so this is recorded and not retried further this session.
#      Someone with a longer path to this host, or PPA/European Dynamics
#      support, could confirm whether this is a standing misconfiguration or
#      transient the way Liberia's own OCDS endpoint reset once on 2026-09-12
#      and then worked fourteen minutes later.
#   2. GHANEPS's HTML "Current Tenders" search (`/epps/quickSearchAction.do?
#      searchSelect=6`) - THIS SOURCE. See above.
#   3. ppa.gov.gh - PPA's own WordPress institutional site. Reachable this
#      session (HTTP 200, real WordPress body). Confirmed again, as on
#      2026-09-12, to carry no listing of its own: its main navigation links
#      straight back to GHANEPS's quickSearchAction (route 2) and to
#      tenders.ppa.gov.gh (route 4, below). Its value this session was
#      checking for a Terms/Disclaimer/Privacy page - see TERMS OF USE below.
#   4. http://tenders.ppa.gov.gh/tenders - PPA's separately-hosted tender
#      application, the "open lead that could not be confirmed" in the
#      2026-09-12 file. STILL NOT READABLE, and now for a clearer reason than
#      "ambiguous sandbox flakiness": both schemes were retried this session.
#      https://tenders.ppa.gov.gh (robots.txt and the listing itself) resets
#      the TLS connection every time - reproduced three times, all
#      `Recv failure: Connection reset by peer` after the CONNECT tunnel
#      itself succeeded, consistent with the ~19-failure pattern the prior
#      session recorded. http://tenders.ppa.gov.gh (plain HTTP, the scheme PPA's
#      own nav actually publishes) DOES connect, cleanly, and returns a real,
#      readable HTTP 503 whose body is an Envoy-style gateway error: "upstream
#      connect error or disconnect/reset before headers. retried and the
#      latest reset reason: connection timeout." That is the site's own edge
#      proxy saying its backend is unreachable - a genuine, parseable response
#      from tenders.ppa.gov.gh's own infrastructure, not a sandbox artifact,
#      not a 403 and not a login wall. This resolves the ambiguity the prior
#      session could not: tenders.ppa.gov.gh's backend is down as of
#      2026-09-13, on the record, and moot regardless because route 2 already
#      works and rule 1 forbids building a second connector for one source.
#
# ROBOTS.TXT, both hosts touched, fetched 2026-09-13, verbatim.
#
#   www.ghaneps.gov.gh/robots.txt and ghaneps.gov.gh/robots.txt both 302 to
#   /epps/home.do, same as ppcc.gov.lr's bare-domain behaviour in
#   sources/liberia.yaml - the app's generic catch-all for an unmapped path, not
#   a robots file. The real one lives at the same place Liberia's does,
#   www.ghaneps.gov.gh/epps/robots.txt, and reads in full:
#     User-agent: Yandex
#     Disallow: /
#
#     User-Agent: MJ12bot
#     Crawl-Delay:   30
#   Byte-identical to eprocurement.ppcc.gov.lr/epps/robots.txt in
#   sources/liberia.yaml - the same European Dynamics deployment default.
#   Nothing here names a generic user agent, disallows /epps/quickSearchAction.
#   do, or sets a crawl delay that binds a non-Yandex, non-MJ12bot client.
#
#   ppa.gov.gh/robots.txt, fetched once, standard WordPress boilerplate
#   (Disallow: /wp-admin/, Allow: /wp-admin/admin-ajax.php, a sitemap line).
#   Moot: ppa.gov.gh carries no listing itself (see HOSTS CHECKED above).
#
# TERMS OF USE / LEGAL NOTICE - NONE FOUND ON EITHER HOST, checked 2026-09-13.
# GHANEPS's own home page and its footer were read in full: no Terms, Privacy
# or Legal link anywhere in the nav or footer, only a one-line
# `©2026 European Dynamics` copyright notice (the vendor, not PPA) - the
# same single line sources/liberia.yaml found on the sibling eGP instance.
# ppa.gov.gh's nav and footer were read the same way: no Terms/Privacy link,
# only "Copyright 2023-2025 Public Procurement Authority. All rights reserved."
# Direct slug guesses on ppa.gov.gh: /terms-of-use/ and /terms-and-conditions/
# and /privacy-policy/ and /legal-notice/ all 404; /disclaimer/ returned a real
# page, but it is a 2020 news post warning the public about fraudsters
# impersonating PPA staff, not a website terms page, so it is not a clause about
# automated access and is not treated as one. No clause exists on either host
# to quote either permitting or restricting automated reading. Absent a clause,
# and with robots.txt permissive and the notices themselves readable with no
# login (see REGISTRATION below), this is `reviewed_ok` on the same basis
# sources/liberia.yaml and sources/ebrd.yaml use for the identical shape of
# absence: a permissive robots.txt and no login wall on the data actually read,
# not a quoted license, because no clause exists to quote.
#
# REGISTRATION - CHECKED SPECIFICALLY, PER THIS ASSESSMENT'S BRIEF, AND THE
# ANSWER IS NO FOR WHAT THIS CONNECTOR NEEDS. Many Ghanaian e-GP portals do
# gate reading behind supplier registration; this one measured otherwise for
# the notice list and the notice PDF, both fetched fresh with no cookie jar and
# no prior request: the "Current Tenders" table (route 2 above) and, from one
# of its rows, the generated notice PDF at
# `/epps/cft/downloadNoticeForAdvSearch.do?resourceId=3403640` (200,
# application/pdf, no login, no cookie) both came back without an account.
# What DOES sit behind an account, read directly from the fetched notice PDF's
# own text ("A complete set of Tender Documents ... may be accessed by
# interested Tenderers through the e-GP portal"), is the full bid-submission
# document package (drawings, BOQs, the actual bidding room) - not fetched or
# tested here, and nobody should register a GHANEPS supplier account to find
# out; that is the same line sources/liberia.yaml drew between the public OCDS
# release and the login-walled `documents[].url`. If document enrichment is
# ever wanted beyond the notice PDF, a named FreeBalance person registering a
# supplier account on GHANEPS - not this pipeline - is the only way in, and
# that decision has not been asked for here.
#
# VOLUME, measured 2026-09-13 from the live "Current Tenders" table, sorted
# newest-publication-first: 69 open tenders in total (page 1 of 7 at 10 per
# page). Reading publication-date timestamps down to the seven-day mark (today
# is 2026-09-13, so the window is 2026-09-06 through 2026-09-13): 16 notices
# published in that span, the most recent on Friday 2026-09-11 and none on the
# Saturday/Sunday since - consistent with a government office not publishing on
# weekends, the same pattern sources/burkina_faso.yaml documents for its own
# gazette. This is one week's measurement, not a rolling multi-week series like
# sources/liberia.yaml's 32-day sample, so the band below carries a wider
# margin than a measured floor/ceiling would need.
#
# LANGUAGE AND CODES, measured against real content this time, not chrome only.
# `<html lang="en">` on both the listing page and the downloaded notice PDF's
# own source markup; the notice PDF itself (`pdftotext`, poppler) is fluent
# English prose. No CPV code or other numbered code system appears anywhere in
# the listing table or the sampled notice PDF (grepped case-insensitively for
# "CPV": zero hits in both); notices are classified only by procurement method
# in free text - "National Competitive Tendering", "Least Cost Selection with
# EOI", "Quality-Cost Based Selection with EOI" - the same absence of a code
# system sources/burkina_faso.yaml records for its own free-text section
# headings.
#
# DOCUMENT / TEXT LAYER. One notice PDF sampled (resourceId=3403640,
# "Construction of Akim Oda Branch Manager's bungalow at Akim Swedru", 2 pages,
# 49,403 bytes). `pdffonts` shows embedded, subsetted CID TrueType fonts
# (BookAntiqua family, `emb yes` throughout) and `pdftotext` extracts real
# prose (2,942 characters) - a genuine text layer, not a scanned image. One
# sample is not sources/burkina_faso.yaml's ten-issue survey; whoever builds
# monitor/normalise/ghana.py should sample a few more across the 69 open
# tenders before assuming every notice PDF on this host carries a text layer.
#
# admin_level is national for the same reason sources/ghana.yaml gave on
# 2026-09-12 and this session did not need to re-check: GHANEPS is, by PPA's
# own published policy, the mandated e-GP system for all government
# procurement, and PPA is Ghana's single national regulator. There is no
# separate sub-national portal to onboard instead or alongside it.
id: ghana
name: Ghana Electronic Procurement System (GHANEPS) - Current Tenders
country: GH
admin_level: national
language: en
stream: portal
# public_listing, not api: quickSearchAction.do is an undocumented Struts
# search-results page, not a published, versioned query surface - the same
# distinction sources/burkina_faso.yaml draws for its own Drupal view. The
# actual documented, structured route (the OCDS records API, same shape as
# sources/liberia.yaml's) exists on this host but errors on every call tried
# this session - see HOSTS CHECKED, route 1 - so it is not "the first route
# that works" per CLAUDE.md step 3 and this HTML listing is used instead.
access: public_listing
# PROVEN, not assumed, unlike the 2026-09-12 file's "working assumption":
# `/epps/quickSearchAction.do?searchSelect=6` fetched with plain curl, no
# JavaScript executed, no browser - the response already contains the 69-row
# results table (title, procuring entity, deadline, publication date, notice
# PDF link) and its own pagination metadata ("69 results in total... Page 1 of
# 7"). Reproduced twice. This is the opposite of a JavaScript-only shell, so
# BrowserConnector - what the 2026-09-12 file guessed by analogy to
# sources/senegal.yaml, sources/benin.yaml and sources/gambia.yaml - is ruled
# out for this host; PageConnector is sources/undp.yaml and sources/mcc.yaml's
# same category for "a public HTML listing with no JS needed", and matches
# what was actually measured here.
connector: PageConnector
wave: 1
# 12:00 UTC daily = 12:00 Accra (Ghana is UTC+0 year-round, no DST). Checked
# against every other schedule currently in sources/ (2026-09-13): nothing else
# runs at :00 past the hour 12 (kosovo is the nearest neighbour, at 12:30).
schedule: '0 12 * * *'
# GHANEPS's own "Current Tenders" quick search, the exact link published in
# both GHANEPS's own home-page nav and ppa.gov.gh's main nav ("Open Tender
# Notices" on ppa.gov.gh actually points at the now-confirmed-dead
# tenders.ppa.gov.gh - see HOSTS CHECKED route 4 - so this URL is read directly
# off GHANEPS's own site, not off PPA's stale link). searchSelect=6 is the
# value GHANEPS's own "Current Tenders" anchor carries; page 1 defaults with
# 10 rows and the listing paginates from there (7 pages at today's volume).
list_url: https://www.ghaneps.gov.gh/epps/quickSearchAction.do?searchSelect=6
# No clause found either permitting or prohibiting automated access on
# ghaneps.gov.gh or ppa.gov.gh - see TERMS OF USE above for everywhere checked.
# reviewed_ok on the same absence-of-restriction basis sources/liberia.yaml
# records for the same vendor's sibling deployment: permissive robots.txt, no
# login wall on any data this connector needs to read.
tos_status: reviewed_ok
# NOT BUILT YET. This entry corrects the route and the connector class that a
# future monitor/connectors/ghana.py and monitor/normalise/ghana.py should be
# written against - PageConnector reading list_url above, not a browser and
# not the dead tenders.ppa.gov.gh host - but writing that connector, its
# contract-test fixture and its normaliser is a separate step, the same gap
# that keeps sources/burkina_faso.yaml and sources/sierra_leone.yaml's siblings
# disabled after onboarding until their own code and fixtures exist.
enabled: false
health:
  # Measured 2026-09-13 from the live "Current Tenders" table: 69 open tenders
  # in total; 16 published in the seven days ending today (2026-09-06 through
  # 2026-09-13), with a visible weekend gap (nothing posted Sep 12-13). One
  # week's measurement rather than sources/liberia.yaml's 32-day rolling
  # series, so the band carries a wider margin than a tightly measured one
  # would: floored above zero per rule 4 (a silent empty run must never read as
  # healthy) and capped well above the one measured week to allow for a
  # busier one.
  expected_items_per_run: [5, 35]
  max_consecutive_failures: 3
owner: ryan.dear
