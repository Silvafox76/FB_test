api_url: https://api.sell2wales.gov.wales/v1/Notices
# WHAT SELL2WALES ADDS BELOW FTS'S THRESHOLD, AND THE OVERLAP FINDING - answered
# structurally from the site's own notice-type taxonomy (Notice Download page
# and API docs), NOT from a live sample, because the list endpoint could not be
# queried (see above). Sell2Wales's own Notice Type list names two populations:
#   - "FTS/OJEU - F1" through "F25": OJEU-derived, above-threshold notices.
#     Sell2Wales's own OCDS Publication Policy says its data "is a direct
#     mapping from the OJEU Tenders Electronic Daily (TED) system" for this
#     population, i.e. these are the SAME above-threshold Welsh notices
#     sources/fts.yaml already ingests from Find a Tender, republished under
#     Sell2Wales's own OCID prefix. This is the duplication the register row
#     asked about, and it is real: pulling these types would hand dedupe two
#     copies of every above-threshold Welsh notice with no shared OCID to key
#     off (the same structural mismatch sources/contractsfinder_gb.yaml found
#     between its own population and Find a Tender's, just in the opposite
#     direction - there the two publishers do not overlap; here Sell2Wales's
#     own documentation says they do).
#   - "Site Notice" types 51-56: Sell2Wales's own below-threshold notices,
#     with no Find a Tender equivalent. This is what the source actually adds:
#     Welsh public-sector opportunities under the GBP 25,000 (goods/services)
#     and GBP 2m (works) advertising thresholds the Publication Policy states,
#     plus sub-contract opportunities under a public prime contract.
# exclude_notice_types below is set on this basis: it drops every FTS/OJEU
# type (already covered by sources/fts.yaml) and every Site Notice type that
# is not an open opportunity (52 Website PIN is planning-stage, too early; 53
# Website Contract Award and 56 Sub Contract Award are results, not
# opportunities), keeping 51 (Website Invitation to Tender Notice), 54
# (Speculative Sub-Contract Opportunity) and 55 (Sub-Contract Opportunity) -
# the tender-stage, below-threshold, Wales-only population. THIS IS A DESIGN
# PROPOSAL FROM THE PUBLISHED TYPE LIST, NOT A LIVE-VERIFIED FILTER: no live
# release of any type could be pulled while the API returns 500, so the
# connector builder must confirm these type codes behave as documented
# against a real response before relying on this list.
exclude_notice_types:
  - "1"
  - "2"
  - "3"
  - "4"
  - "5"
  - "6"
  - "7"
  - "12"
  - "13"
  - "14"
  - "15"
  - "20"
  - "21"
  - "22"
  - "23"
  - "24"
  - "25"
  - "52"
  - "53"
  - "56"
enabled: false        # blocked: live API returns 500 on every query tried; see above
health:
  # NOT MEASURED. This band is a wide, deliberately unverified placeholder,
  # not a count taken from live data - the /v1/Notices endpoint that would
  # produce a count returns HTTP 500 for every request tried on 2026-09-19
  # (see above), and the bulk-download form failed the same day. It must be
  # replaced with a real 7-day count, the same way every other health block
  # in sources/*.yaml carries one, before this source is enabled. Left wide
  # (0 to 100, the same ceiling sources/contractsfinder_gb.yaml's single-page
  # API response cap uses) only so the model does not reject the file for
  # want of a number; it should not be read as evidence of expected volume.
  expected_items_per_run: [0, 100]
  max_consecutive_failures: 3
