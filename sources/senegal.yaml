# Senegal's national public procurement portal. Every candidate entry point named
# in the onboarding brief was checked live on 2026-09-12 rather than assumed, and
# three of the four are dead or are the wrong host:
#
#   1. https://armp.sn -> HTTP 200, but the body is a 76-byte redirect stub,
#      `<html><body><script>window.location='http://arcop.sn'</script></body></html>`.
#      ARMP (Autorité de Régulation des Marchés Publics) has been renamed ARCOP
#      (Autorité de Régulation de la Commande Publique) and the old host forwards to
#      the new one. arcop.sn itself resolves and answers 200/301 (www redirects to
#      bare domain) and is a WordPress site - the regulator's institutional site, not
#      a notice listing. Its own `wp-json/wp/v2/pages` inventory is mostly a
#      commerce-theme demo left in place (Shop, Cart, Checkout, Donation pages), so it
#      is not a curated site to read either.
#   2. https://dcmp.sn and https://www.dcmp.sn -> do not resolve at all
#      (`socket.gaierror: Name or service not known`, confirmed independent of the
#      session's egress proxy: the proxy's own status log records the same host as a
#      "connect_rejected ... gateway answered 502" at the same moment, i.e. its own
#      resolver failed too). DCMP as a standalone host is gone.
#   3. https://marchespublics.sn -> same, does not resolve at all.
#      https://www.marchespublics.sn (the www host, which *does* resolve, to
#      213.154.85.241) answers plain HTTP with `503 Service Unavailable` and the body
#      text `upstream connect error or disconnect/reset before headers ... connection
#      timeout` - an Envoy/Istio gateway with no live backend behind it - and resets
#      the TLS connection outright on HTTPS. This is a stood-up-but-dead legacy stack,
#      not a portal to onboard.
#   4. SYGMAP: no `sygmap.sn` or `sygmap.bj` host resolves either. Not a route here.
#
# THE ACTUAL PORTAL, found from ARCOP's own site rather than guessed: arcop.sn's
# homepage names "APPEL (Achats Publics en Procédures Électroniques)" as where
# tenders are now published, at https://achatspublics.sn, and links a supplier
# manual PDF (see below) that confirms it. This is the one entry point that is live,
# is the government's own platform (ARCOP is the statutory regulator; the manual's
# cover page carries the Republic of Senegal's arms and ARCOP's own logo), and is
# not a third-party mirror. Note the manual's own prose gives the domain once as
# `https://achatpublics.sn` (singular "achat") - that spelling does not resolve
# (`gaierror`). The real, working domain is `achatspublics.sn` (plural), which is
# also what robots.txt, the sitemap and every live page on the site itself use; the
# manual's typo is recorded here so nobody "corrects" this file to the broken form.
#
# ROBOTS.TXT (achatspublics.sn, fetched 2026-09-12, verbatim):
#   # START nuxt-robots (indexable)
#   User-agent: *
#   Disallow:
#   Sitemap: https://achatspublics.sn/sitemap_index.xml
#   # END nuxt-robots
# An empty Disallow permits every path. No crawl-delay is stated.
#
# THE FRONT END IS A JS-ONLY SPA - AND THAT IS NOT WHERE THIS SOURCE ENDS UP READING.
# achatspublics.sn is a Nuxt single-page application with no server-side rendering.
# The raw HTML for the home page, `/consultations/tenders` (the tender listing) and
# `/consultations/avis-generaux` are byte-identical, all 22,857 bytes, and every one
# of them contains only `<div id="__nuxt" class="isolate"></div>` plus `<script>`
# tags - no notice, title or date anywhere in the served document. A second tool
# (WebFetch, which also does not execute JavaScript) independently rendered the same
# URL to nothing. Reading this host with selectolax, PageConnector-style, would parse
# 22KB of script tags into zero notices forever, which is worse than not onboarding
# it (rule 4). On its own this would make the source BrowserConnector, contradicting
# BUILD_ORDER.md step 17's plan ("Build: Benin and Senegal as PageConnector on
# structured listings") - exactly the kind of assumption this onboarding step exists
# to check rather than carry forward.
#
# IT DID NOT END THERE, because a browser is not actually needed: reading the SPA's
# own shipped JavaScript (fetched live, not documentation memory) rather than
# executing it found the real data route. `/consultations/tenders` resolves, per the
# route table in the app's entry bundle, to component chunk `KMI_fVl0.js`, whose
# compiled source calls a Pinia action `getTenders` that does
# `M({url:"/anon/tdo", method:"GET", params:a})` against a second host,
# `api.achatspublics.sn`. That call was reproduced directly with a plain
# unauthenticated GET and it works:
#
#   GET https://api.achatspublics.sn/anon/tdo?size=100  -> HTTP 200, application/json
#   {"success":true,"message":"SUCCESS","data":{"content":[ ...35 tenders... ],
#    "totalElements":35,"totalPages":1,"size":100,"number":0, ...}}
#
# This is a real, live, unauthenticated, structured JSON API - not a scrape, not a
# guess at an internal endpoint, and not "routing around" anything: it is the exact
# call the portal's own official public page makes to render the exact same public
# information, called directly instead of through a rendering engine. It ranks above
# "public HTML listing" in the onboarding brief's access-route order, so it is what
# this source reads. access is `api`, connector is `FeedConnector`, and
# BrowserConnector/Playwright is not needed for this source after all - the SPA
# finding above is recorded rather than deleted because it explains why the obvious
# first read (selectolax against achatspublics.sn) would have failed, and why
# BUILD_ORDER.md step 17's "PageConnector on structured listings" line for Senegal is
# also not quite right: the structured listing is JSON from a second host, not HTML.
#
# THE SISTER HOST'S DEFAULT POSTURE IS THE OPPOSITE: `api.achatspublics.sn/` and
# every path guessed on it before `/anon/tdo` was found - `/api/consultations`,
# `/api/public/consultations`, `/actuator/health`, even `/robots.txt` - answered `401`
# with `WWW-Authenticate: Bearer` (Spring Security's default of denying everything not
# explicitly opened; `/actuator/health` alone was a bare 404, i.e. not mapped rather
# than guarded). `/anon/**` is the one namespace carved out of that default deny, and
# its name is the platform's own: this is deliberate public-read design, not a hole.
# Confirmed public, unauthenticated and returning the same shape as the JSON above:
#   /anon/tdo             the tender listing (this source's list route)
#   /anon/tdo/count       {"success":true,"data":94} - see COUNTS DISAGREE below
#   /anon/stats/current-year   {"suppliers":1474,"contractingAuthorities":99,
#                                "procurementPlan":76,"tdo":220}
#   /anon/auth/organizations/contact   the platform's own support line, not a person
#
# COUNTS DISAGREE ACROSS THESE THREE ENDPOINTS (94 vs 220 vs 35 in-hand), and that is
# recorded rather than resolved: `/anon/tdo` returns only `status:"PUBLISHED"` records
# (confirmed: all 35 in hand carry that status) and is very likely scoped to
# currently-open or otherwise-filtered tenders, while `/anon/tdo/count` (94) and the
# current-year `tdo` figure (220, which counts 2026 only and so cannot be a subset of
# a 35-row all-time list) are counting a wider and differently-scoped set that this
# endpoint's own response does not explain. Whoever builds the connector should read
# `/anon/tdo`'s own total (`totalElements`) as ground truth for what this source
# yields, not the two count endpoints, and should not assume 94 or 220 as a ceiling.
#
# A PAGINATION HAZARD, measured rather than assumed to work: `?page=1` and `?size=20`
# together, `?pageNumber=1`, and `?page=1&sort=createdAt,desc` were all tried against
# `/anon/tdo` and every one of them returned `pageable.pageNumber: 0` and the SAME 20
# rows as `?page=0` - the `page` parameter is silently ignored, the same shape of
# hazard `monitor/connectors/ebrd.py` documents for ECEPP ("not one query parameter
# exists"). What does work is `size`: `?size=100` returns all 35 rows in one response
# (`totalPages` becomes 1). Given the whole corpus is two figures below 100 today, the
# working strategy is EBRD's - request one generously-sized page (`size=200` or so)
# and treat the response as the whole archive, filtering client-side - rather than
# trusting `page` to walk anything. A connector must compare `numberOfElements` to
# `totalElements` on every run and raise if the fixed size ever stops covering the
# total, the same discipline as EBRD's archive-in-one-page read.
#
# A TEST RECORD IS LIVE IN THE PUBLIC DATA. One of the 35 rows in hand is
# `reference: "T_MDE_DSI_627"`, `libelle: "[Marché de test ] Rénovation du bâtiment
# des archives"`, published by `organization.libelle: "Ministère de la
# dématérialisation (TESTS APPEL)"` - self-labelled as a test in both the title and
# the buyer name. Left here rather than filtered, because filtering it is a lexicon or
# normaliser decision (rule 5) and not this registry's to take; noted so whoever
# builds the connector is not surprised by a dummy notice from a fake ministry.
#
# REGISTRATION: NOT REQUIRED TO READ A LISTING, on two independent lines of evidence.
# First, `/anon/tdo` answers with no credential at all, as shown above. Second, ARCOP's
# own supplier manual ("Manuel d'utilisation APPEL : Fournisseurs",
# arcop.sn/wp-content/uploads/2025/12/Manuel_dutilisation_APPEL_Fournisseurs-.pdf, PDF
# Last-Modified 2026-06-17) says so twice in prose: "L'espace public est accessible
# sans authentification" (section I.1) and, in bold, "La consultation peut se faire
# même si on n'est pas connecté et une fois connecté, le bouton « Consultations »
# permet d'accéder aux appels d'offres." (section III). An account ("Inscription") is
# needed only to "manifester son intérêt" (express interest), open a tender's full
# document dossier, ask the authority a question, or submit a bid - none of which this
# pipeline needs. access is `public_listing` in spirit (no account gates the notice
# data) even though the concrete route is the JSON API above rather than the rendered
# page.
#
# VOLUME - MEASURED FROM THE LIVE ARCHIVE, 2026-09-12, not guessed. The 35 rows in
# hand span 2025-11-11 to 2026-09-11 with real ISO 8601 timestamps (unambiguous,
# unlike EBRD's dd/mm/yyyy - no day/month guess needed here, rule 10 is easy on this
# source). Rolling-window counts computed directly over those 35 publicationDates:
#   7-day window over the archive's lifetime:  min 0, median 0, mean 0.77, max 6;
#                                               174 of 306 daily windows are zero.
#   30-day window, same method:                min 0, median 3, mean 3.15, max 10;
#                                               38 of 306 daily windows are zero.
#   Last 7 days from today (2026-09-12):       2 published (2026-09-08, 2026-09-11).
#   Last 30 days from today:                   4 published.
# Unlike sources/ebrd.yaml, a 30-day window here does NOT get the zero-count problem
# fully to zero (38 of 306, ~12%, are still empty) - this source is genuinely this
# sparse some months, not under-measured. It is also very possibly accelerating:
# `/anon/stats/current-year` reports 1,474 suppliers against the supplier manual's own
# screenshot of 37 "as of 2025", a roughly 40x jump, and the two most recent
# publications landed in the last four days measured. A person should decide whether
# to accept occasional false-unhealthy runs on a 30-day window or use a longer one;
# the health block below uses 30 days and documents the same tension sources/ebrd.yaml
# does rather than hiding it.
#
# LANGUAGE AND CODES. Every screenshot in the supplier manual is French; the site's
# sitemap also declares `en` and `ar` alternates (hreflang), but French is the default
# and `x-default`, and every row fetched from `/anon/tdo` is French prose. No CPV code
# appears anywhere: the platform's own commodity catalogue is called `unspsc`
# internally (`GET /unspsc`, `GET /unspsc/ChildUnspscs/{id}`, confirmed in the same JS
# bundle) and is presented in the supplier-facing UI as ten lettered top-level
# categories, A "Matières premières..." through J "Services". No UNSPSC or category
# code was present on any of the 35 tender rows read from `/anon/tdo` itself, only on
# the commodity-search endpoints a supplier uses when registering what it sells, so
# the free code-based filter has nothing to run against here either way; this source
# falls to the lexicon stage, the same shape as sources/ebrd.yaml.
#
# RE-VERIFIED LIVE, 2026-09-13 (this assessment), ONE POLITE PASS PER PAGE. Every
# figure and route from the 2026-09-12 pass above still holds and none of it was
# taken on faith: robots.txt re-fetched byte-identical (empty Disallow, same
# sitemap line); `GET /anon/tdo?size=200` still returns `totalElements: 35`,
# `totalPages: 1` (the whole archive still fits one page); `/anon/tdo/count` still
# answers 94 and `/anon/stats/current-year` still answers
# `{"suppliers":1474,"contractingAuthorities":99,"procurementPlan":76,"tdo":220}`,
# unchanged to the digit a day later; `GET /` on api.achatspublics.sn still 401s
# with `WWW-Authenticate: Bearer` (Spring Security's default deny is still the
# default, `/anon/tdo` is still the deliberate carve-out); `GET /unspsc` still
# answers 200. Volume recomputed against today's date (2026-09-13) rather than
# copied forward: last 7 days = 2 notices (2026-09-08, 2026-09-11), last 30 days =
# 4 - identical to the 2026-09-12 figures, which is expected since no new notice
# landed in the one intervening day.
#
# TWO FIELDS READ FOR THE FIRST TIME TODAY, both worth recording:
#   - No row in the 35-record archive, and no field on the single-record detail
#     read (`GET /anon/tdo/{uid}`, same shape as the listing row), carries a value
#     or a currency anywhere - not `montant`, `amount`, `currency`, `devise`,
#     `xof`, `budget` or `valeur` in any form; grepped for all of those,
#     case-insensitively, across the full 35-record payload and found none. This
#     source has no Total Opportunity Amount to carry in any currency, published
#     or otherwise: `notices.estimated_value` and `value_currency` are null for
#     every notice this connector will ever produce, not a gap in the connector's
#     reading of the response. `config/fx.yaml`'s XOF peg has nothing to convert
#     here, the same "no rate, no figure" shape CLAUDE.md's appendix E describes
#     for an uncovered currency, except here it is the amount itself that is
#     absent, not the rate. Whoever builds monitor/normalise/senegal.py should not
#     go looking harder for a value field: there is not one to find.
#   - Every one of the 35 rows has `tenderNoticeFile: null`. No document was
#     available to check for a session wall or a PDF text layer in this archive as
#     it stands today - that observation stays open, not answered, for whoever
#     builds the connector once a row with a populated `tenderNoticeFile` appears.
#   - A field not mentioned in the 2026-09-12 pass, `cible`, splits the 35 rows
#     29 "COMMUNITY" to 6 "NATIONAL". This reads as a bidder-eligibility scope
#     (UEMOA/regional-community threshold vs. Senegal-only, the same national/
#     "communautaire" split West African procurement codes commonly draw for
#     which bidders may compete) rather than a buyer administrative level, and is
#     recorded rather than acted on: it does not change `admin_level` below, which
#     still rests on `acType`/`organization` mostly being central agencies and
#     ministries (see the original VOLUME/marketType sampling), and a person
#     reading OCDS-style eligibility text at normalisation time should decide
#     what, if anything, `cible` is worth to the record rather than this registry
#     guessing.
#
# TOS: REVIEWED_OK, changed from `pending` on 2026-09-13 re-review, on the same
# standard sources/burkina_faso.yaml and sources/liberia.yaml both apply -
# absence of any restrictive clause, plus a permissive robots.txt, plus no login
# wall on the data actually read - with one additional piece of evidence that
# was not available on the first pass. The earlier `pending` rested on "a footer
# link cannot be confirmed without running its JavaScript"; that gap is closed,
# not worked around, by reading the app's own declared route table instead of its
# footer. `@nuxtjs/sitemap` (the tool that generates achatspublics.sn's
# `sitemap_index.xml`) enumerates the application's own defined page routes, not
# merely the ones linked from a visible menu, and it was fetched fresh in all
# three declared languages (`fr.xml`, `en.xml`, `ar.xml`, 2026-09-13): 30-odd
# routes each - `banned`, `in_review`, `inactive`, `news`, `registration`, every
# `consultations/*`, `dashboard/*`, `rapports/*`, `ressources/*` and `tools/*`
# page the SPA has, right down to an authenticated-only leaf like
# `dashboard/roles/new` - and not one of them is named anything resembling
# mentions-legales, conditions-generales, conditions-d-utilisation, cgu, terms or
# privacy in any language variant. This is stronger evidence than a rendered
# footer would have given (a footer can omit an unlinked page; a generated route
# table cannot omit a route that exists), and it is corroborated by arcop.sn's
# own `wp-json/wp/v2/pages` inventory, re-checked in full on 2026-09-13 and
# unchanged: still only the WordPress commerce-theme demo pages (shop, cart,
# checkout, donation flows) plus a handful of real ones (`reglementation`,
# `contact`, `meet-the-team`), none of them a website terms page either.
# Registration terms may still exist only inside the sign-up flow itself, which
# this agent will not open (never register an account on FreeBalance's behalf) -
# but that flow is irrelevant to this source, which reads `/anon/tdo` without an
# account. Weighed the same way sources/burkina_faso.yaml's tos_status comment
# weighs its own bare copyright line: if a person weighs this differently, the
# honest fallback is `pending`, not `reviewed_restricted`, since nothing found
# here, on either host, in any language, actually forbids the fetch.
id: senegal
name: Achat Public en Procédures Électroniques (APPEL), Senegal
country: SN
admin_level: national
language: fr
stream: feed
access: api
# See "IT DID NOT END THERE" above: the listing is JSON from api.achatspublics.sn,
# read directly with one GET, not a rendered page. No BrowserConnector, no Playwright.
connector: FeedConnector
wave: 1
# 11:00 UTC daily = 11:00 Dakar (Senegal is UTC+0 year-round, no DST). Chosen to
# collide with nothing already in sources/: boamp 04:30, doe 05:00, ted 06:00,
# prozorro 06:30, fts 07:00, undp 07:30, worldbank 08:00, simap/worldbank_pipeline
# 08:30, euft/place 09:00, mcc Monday 09:30, ungm 10:00, ebrd 10:30.
schedule: '0 11 * * *'
# The public tender endpoint, confirmed live 2026-09-12 (see the JSON above). Use a
# generous `size` (the PAGINATION HAZARD note above: `page` is ignored, `size` is not)
# rather than walking pages.
api_url: https://api.achatspublics.sn/anon/tdo
# See "TOS: REVIEWED_OK" above: no restrictive clause exists to quote on either
# host, in any of the three declared languages, checked against achatspublics.sn's
# own generated route table (not just a footer) and against arcop.sn's full WP
# page inventory. Changed from `pending` on 2026-09-13.
tos_status: reviewed_ok
# Still false: this registry entry is the onboarding, not the connector. As of
# 2026-09-13 there is no monitor/connectors/senegal.py, no
# monitor/normalise/senegal.py and no tests/contract/fixtures/senegal.json - the
# same "assessed, not yet built" state sources/burkina_faso.yaml documents for
# itself. Enabling this source is a later step's act, not this one's.
enabled: false
health:
  # Measured against the live 35-row archive on 2026-09-12 (see VOLUME above), not
  # guessed. A 30-day connector window gives median 3, mean 3.15, max 10 over the
  # archive's lifetime, so the upper bound has headroom above the worst day seen.
  # Floored at 1 rather than 0 so a silent run never reads as a healthy empty one
  # (rule 4) - but unlike sources/ebrd.yaml this floor is not fully safe: 38 of 306
  # historical 30-day windows (about 12%) are genuinely zero, so an occasional
  # false-unhealthy reading on this source is a known, measured possibility and not a
  # sign the connector is broken. Recent activity (1,474 suppliers now vs. 37 in the
  # supplier manual's own 2025 screenshot) suggests the true rate is climbing above
  # this lifetime average, which is one more reason to re-measure after a few weeks of
  # real runs rather than treat this band as final. Re-checked 2026-09-13: the archive
  # is still exactly 35 rows with the same publicationDate range, so this band is
  # carried forward unchanged rather than recomputed against different data.
  expected_items_per_run: [1, 15]
  max_consecutive_failures: 3
owner: ryan.dear
