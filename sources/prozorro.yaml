# Ukraine's national e-procurement system. Titles are Ukrainian and stay Ukrainian
# (rule 9); they reach the scorer only on a passing CPV prefix until the translation
# stage lands at step 14.
id: prozorro
name: Prozorro
country: UA
language: uk
admin_level: national
stream: feed
wave: 1
access: api
connector: FeedConnector
schedule: '30 6 * * *'         # 06:30 UTC daily
api_url: https://public.api.openprocurement.org/api/2.5/tenders
tos_status: reviewed_ok        # public API, open data by law
enabled: true         # step 9: fixture recorded 2026-09-12, contract test passing
health:
  # Measured 2026-09-12: about 2,000 tenders are modified a day and roughly 9% of
  # them are open to a bidder, so a day's run fetches on the order of 180 details.
  # The upper bound is also the detail-request ceiling.
  expected_items_per_run: [5, 400]
  max_consecutive_failures: 3
owner: ryan.dear
