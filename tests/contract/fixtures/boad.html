uot;:&quot;content_block&quot;,&quot;content_blocks_container&quot;:[{&quot;acf_fc_layout&quot;:&quot;columns_content_layout&quot;,&quot;title&quot;:&quot;Activit\u00e9s&quot;,&quot;left_contents&quot;:{&quot;content_elements&quot;:[{&quot;acf_fc_layout&quot;:&quot;text_component&quot;,&quot;text&quot;:&quot;&lt;p&gt;Le D\u00e9partement de l\u2019Agriculture et de l\u2019Agro-industrie de la BOAD r\u00e9alise ses activit\u00e9s \u00e0 travers la mise en place de pr\u00eats directs \u00e0 moyen et long terme en faveur des Etats et des acteurs du secteur priv\u00e9, et de lignes de financement \u00e0 court terme d\u00e9di\u00e9es aux campagnes agricoles. L\u2019activit\u00e9 de la BOAD dans ce secteur s\u2019articule essentiellement sur deux axes :&lt;\/p&gt;\n&lt;p&gt;&amp;nbsp;&lt;\/p&gt;\n&lt;p&gt;&lt;strong&gt;I. Le soutien du d\u00e9veloppement de l\u2019agriculture, de la s\u00e9curit\u00e9 alimentaire et de la r\u00e9silience agricole.&lt;\/strong&gt;&lt;\/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Pr\u00e9paration, structuration et financement de projets et programmes agricoles r\u00e9gionaux&lt;\/li&gt;\n&lt;li&gt;Suivi de la mise en \u0153uvre des projets et programmes agricoles de l&amp;rsquo;UEMOA financ\u00e9s&lt;\/li&gt;\n&lt;li&gt;Int\u00e9gration de la dimension climat, de la r\u00e9alisation de forages et puits \u00e9quip\u00e9s et de latrines dans la structuration des projets de d\u00e9veloppement rural financ\u00e9s&lt;\/li&gt;\n&lt;\/ul&gt;\n&lt;p&gt;&amp;nbsp;&lt;\/p&gt;\n&lt;p&gt;&lt;strong&gt;II. Accompagner les entreprises intervenant dans les fili\u00e8res agricoles prioritaires de l&amp;rsquo;UEMOA et promouvoir la transformation locale des produits agricoles.&lt;\/strong&gt;&lt;\/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Participation \u00e0 l&amp;rsquo;origination et la structuration des projets priv\u00e9s en vue de leur financement.&lt;\/li&gt;\n&lt;\/ul&gt;\n&quot;}]},&quot;right_contents&quot;:{&quot;content_elements&quot;:[{&quot;acf_fc_layout&quot;:&quot;pictur quot;content_block&quot;,&quot;content_blocks_container&quot;:[{&quot;acf_fc_layout&quot;:&quot;columns_content_layout&quot;,&quot;title&quot;:&quot;La BOAD au coeur des initiatives pour la s\u00e9curit\u00e9 \u00e9nerg\u00e9tique  en Afrique de l\u2019Ouest&quot;,&quot;left_contents&quot;:{&quot;content_elements&quot;:[{&quot;acf_fc_layout&quot;:&quot;text_component&quot;,&quot;text&quot;:&quot;&lt;h3&gt;L\u2019initiative r\u00e9gionale pour l\u2019\u00e9nergie durable (IRED)&lt;\/h3&gt;\n&lt;p&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;Afin de mieux faire face\u00a0 aux crises \u00e9nerg\u00e9tiques r\u00e9currentes dans plusieurs des Etats membres de l\u2019UEMOA, la Conf\u00e9rence des Chefs d\u2019Etat et de Gouvernement a d\u00e9cid\u00e9, en janvier 2008,\u00a0 de la mise en place d\u2019une commission pour proposer une strat\u00e9gie intitul\u00e9e \u00ab Initiative R\u00e9gionale pour l\u2019Energie Durable (IRED) \u00bb.&lt;\/span&gt;&lt;\/p&gt;\n&quot;}]},&quot;right_contents&quot;:{&quot;content_elements&quot;:[{&quot;acf_fc_layout&quot;:&quot;text_component&quot;,&quot;text&quot;:&quot;&lt;h3&gt;L\u2019IRED vise, \u00e0 l\u2019horizon 2030, un taux d\u2019acc\u00e8s de 100% \u00e0 l\u2019\u00e9lectricit\u00e9 dans l\u2019UEMOA.&lt;\/h3&gt;\n&lt;p&gt;En pratiquant des prix bas et dans le cadre d\u2019un vaste march\u00e9 d\u2019\u00e9changes d\u2019\u00e9nergie \u00e9lectrique int\u00e9gr\u00e9 et harmonis\u00e9 \u00e0 l\u2019\u00e9chelle de l\u2019Afrique de l\u2019Ouest. Ce march\u00e9 r\u00e9gional s\u2019appuierait sur un partenariat public-priv\u00e9 dynamique. L\u2019IRED cible \u00e9galement en 2030 un accroissement \u00e0 82% de la proportion des \u00e9nergies renouvelables et durables dans le parc de production \u00e9lectrique de l\u2019UEMOA.&lt;\/p&gt;\n&lt;p&gt;Le dispositif institutionnel et financier de mise en \u0153uvre de l\u2019IRED comprend notamment\u00a0 un Fonds de D\u00e9veloppement Energie (FDE), \u00e0 caract\u00e8re concessionnel ;\u00a0 et\u00a0 un fonds d\u2019investissement, le Fonds Infrastructures, de type priv\u00e9.&lt;\/p&gt;\n&quot;}]}}],&quot;background&quot;:false},{&quot;acf_fc_layout&quot;:&quot;content_block&quot;,&quot;content_blocks_container&quot;:[{&quot;acf_fc_layout&quot;:&quot;columns_content_layout&quot;,&quot;title&quot;:&quot;Le fonds de d\u00e9veloppement \u00e9nergie (FDE)&quot;,&quot;left_contents&quot;:{&quot;content_elements&quot;:[{&quot;acf_fc_layout&quot;:&quot;picture_component&quot;,&quot;picture_file&quot;:{&quot;ID&quot;:563964,&quot;id&quot;:563964,&quot;title&quot;:&quot;Le FDE&quot;,&quot;filename&quot;:&quot;le-fde.jpeg&quot;,&quot;filesize&quot;:87720,&quot;url&quot;:&quot;https:\/\/admin.boad.org\/wp-content\/uploads\/2024\/03\/le-fde.jpeg&quot;,&quot;link&quot;:&quot;https:\/\/admin.boad.org\/fr\/nos-secteurs-dintervention\/energie-et-ressources-naturelles\/le-fde\/&quot;,&quot;alt&quot;:&quot;Homme qui inspecte le r\u00e9seau \u00e9lectrique a\u00e9rien&quot;,&quot;author&quot;:&quot;1&quot;,&quot;description&quot;:&quot;&quot;,&quot;caption&quot;:&quot;Le FDE&quot;,&quot;name&quot;:&quot;le-fde&quot;,&quot;status&quot;:&quot;inherit&quot;,&quot;uploaded_to&quot;:563961,&quot;date&quot;:&quot;2024-03-27 14:00:24&quot;,&quot;modified&quot;:&quot;2024-03-27 14:00:32&quot;,&quot;menu_order&quot;:0,&quot;mime_type&quot;:&quot;image\/jpeg&quot;,&quot;type&quot;:&quot;image&quot;,&quot;subtype&quot;:&quot;jpeg&quot;,&quot;icon&quot;:&quot;https:\/\/admin.boad.org\/wp-includes\/images\/media\/default.png&quot;,&quot;width&quot;:1440,&quot;height&quot;:1080,&quot;sizes&quot;:{&quot;thumbnail&quot;:&quot;https:\/\/admin.boad.org\/wp-content\/uploads\/2024\/03\/le-fde-150x150.jpeg&quot;,&quot;thumbnail-width&quot;:150,&quot;thumbnail-height&quot;:150,&quot;medium&quot;:&quot;https:\/\/admin.boad.org\/wp-content\/uploads\/2024\/03\/le-fde-300x225.jpeg&quot;,&quot;medium-width&quot;:300,&quot;medium-height&quot;:225,&quot;medium_large&quot;:&quot;https:\/\/admin.boad.org\/wp-content\/uploads\/2024\/03\/le-fde-768x576.jpeg&quot;,&quot;medium_large-width&quot;:768,&quot;medium_large-height&quot;:576,&quot;large&quot;:&quot;https:\/\/admin.boad.org\/wp-content\/uploads\/2024\/03\/le-fde-1024x768.jpeg&quot;,&quot;large-width&quot;:1024,&quot;large-height&quot;:768,&quot;1536x1536&quot;:&quot;https:\/\/admin.boad.org\/wp-content\/uploads\/2024\/03\/le-fde.jpeg&quot;,&quot;1536x1536-width&quot;:1440,&quot;1536x1536-height&quot;:1080,&quot;2048x2048&quot;:&quot;https:\/\/admin.boad.org\/wp-content\/uploads\/2024\/03\/le-fde.jpeg&quot;,&quot;2048x2048-width&quot;:1440,&quot;2048x2048-height&quot;:1080}},&quot;picture_has_target_link&quot;:false,&quot;picture_target_link&quot;:null,&quot;orientation&quot;:&quot;default&quot;}]},&quot;right_contents&quot;:{&quot;content_elements&quot;:[{&quot;acf_fc_layout&quot;:&quot;text_component&quot;,&quot;text&quot;:&quot;&lt;p&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;Mis en place le 25 septembre 2009, le FDE a pour objet de contribuer \u00e0 l\u2019am\u00e9lioration de l\u2019acc\u00e8s \u00e0 l\u2019\u00e9nergie des Etats membres de l\u2019UEMOA et de promouvoir le d\u00e9veloppement durable de l\u2019\u00e9nergie en intervenant \u00e0 des conditions concessionnelles pour le financement de projets \u00e9ligibles \u00e0 l\u2019IRED. Sa gestion est assur\u00e9e par la BOAD.&lt;\/span&gt;&lt;\/p&gt;\n&lt;p&gt;&amp;nbsp;&lt;\/p&gt;\n&lt;p&gt;Le FDE a d\u00e9marr\u00e9 ses op\u00e9rations au cours du premier semestre de 2010. Au\u00a0 31 d\u00e9cembre 2016, 14\u00a0 projets d\u2019\u00e9nergie avaient \u00e9t\u00e9 financ\u00e9s sous forme de pr\u00eats au titre du FDE, pour un montant global de 229,7 milliards de FCFA.&lt;\/p&gt;\n&quot;}]}}],&quot;background&quot;:true},{&quot;acf_fc_layout&quot;:&quot;content_block&quot;,&quot;content_blocks_container&quot;:[{&quot;acf_fc_layout&quot;:&quot;simple_content_layout&quot;,&quot;title&quot;:&quot;Le fonds infrastructures&quot;,&quot;content_elements&quot;:{&quot;content_elements&quot;:[{&quot;acf_fc_layout&quot;:&quot;text_component&quot;,&quot;text&quot;:&quot;&lt;p&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;Il est d\u00e9di\u00e9 aux investissements priv\u00e9s. C\u2019est un fonds \u00e0 but lucratif, destin\u00e9 au financement des infrastructures d\u2019\u00e9lectricit\u00e9 dans l\u2019UEMOA, selon les termes et conditions du march\u00e9. Il vise en outre \u00e0 financer la restructuration des soci\u00e9t\u00e9s d\u2019\u00e9lectricit\u00e9, le programme d\u2019urgence et les projets \u00e0 moyen et long termes. Il constituera un levier pour les partenariats public-priv\u00e9 dans le secteur de l\u2019\u00e9lectricit\u00e9 en zone UEMOA. Les diligences relatives \u00e0 sa mise en place sont en cours au niveau de la BOAD.&lt;\/span&gt;&lt;\/p&gt;\n&quot;}]}}],&quot;background&quot;:false},{&quot;acf_fc_layout&quot;:&quot;content_block&quot;,&quot;content_blocks_container&quot;:[{&quot;acf_fc_layout&quot;:&quot;simple_content_layout&quot;,&quot;title&quot;:&quot;Objectif du Plan Djoliba 2021-2025&quot;,&quot;content_elements&quot;:{&quot;content_elements&quot;:[{&quot;acf_fc_layout&quot;:&quot;text_component&quot;,&quot;text&quot;:&quot;&lt;p class=\&quot;chiffre-number\&quot; style=\&quot;text-align: center;\&quot;&gt;380 MW&lt;\/p&gt;\n&quot;},{&quot;acf_fc_layout&quot;:&quot;text_component&quot;,&quot;text&quot;:&quot;&lt;p style=\&quot;text-align: center;\&quot;&gt;De capacit\u00e9 suppl\u00e9mentaire pour am\u00e9liorer le taux d\u2019\u00e9lectrification et la desserte \u00e9nerg\u00e9tique dans l\u2019UEMOA \u00e0 l\u2019horizon 2025&lt;\/p&gt;\n&quot;},{&quot;acf_fc_layout&quot;:&quot;button_component&quot;,&quot;button_link&quot;:false,&quot;button_align&quot;:&quot;center&quot;}]}}],&quot;background&quot;:true},{&quot;acf_fc_layout&quot;:&quot;content_block&quot;,&quot;content_blocks_container&quot;:[{&quot;acf_fc_layout&quot;:&quot;columns_content_layout&quot ;&gt;D\u00e9veloppement des interconnexions r\u00e9gionales et transfrontali\u00e8res.&lt;\/span&gt;&lt;\/li&gt;\n&lt;li style=\&quot;font-weight: 400;\&quot; aria-level=\&quot;1\&quot;&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;Am\u00e9lioration du taux d\u2019acc\u00e8s \u00e0 l\u2019\u00e9lectricit\u00e9 (IPP, Off Grid dans les communaut\u00e9s rurales, etc.).\u00a0&lt;\/span&gt;&lt;\/li&gt;\n&lt;li style=\&quot;font-weight: 400;\&quot; aria-level=\&quot;1\&quot;&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;Appui aux Etats et aux soci\u00e9t\u00e9s d\u2019\u00e9lectricit\u00e9 en vue d\u2019assurer l\u2019\u00e9quilibre financier du secteur.&lt;\/span&gt;&lt;\/li&gt;\n&lt;\/ul&gt;\n&lt;p&gt;&amp;nbsp;&lt;\/p&gt;\n&lt;h3&gt;Nos priorit\u00e9s d\u2019intervention dans le domaine des Ressources Naturelles :&lt;\/h3&gt;\n&lt;p&gt;&amp;nbsp;&lt;\/p&gt;\n&lt;ul&gt;\n&lt;li style=\&quot;font-weight: 400;\&quot; aria-level=\&quot;1\&quot;&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;D\u00e9velopper l\u2019hydraulique semi urbaine et rurale : forage \u00e0 motricit\u00e9 humaine et mini adduction d\u2019eau potable.&lt;\/span&gt;&lt;\/li&gt;\n&lt;li style=\&quot;font-weight: 400;\&quot; aria-level=\&quot;1\&quot;&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;D\u00e9velopper le contenu local dans l\u2019exploitation mini\u00e8re et p\u00e9troli\u00e8re.&lt;\/span&gt;&lt;\/li&gt;\n&lt;li style=\&quot;font-weight: 400;\&quot; aria-level=\&quot;1\&quot;&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;Promouvoir l\u2019exploitation mini\u00e8re semi m\u00e9canis\u00e9e pour lutter contre l\u2019orpaillage clandestin.&lt;\/span&gt;&lt;\/li&gt;\n&lt;\/ul&gt;\n&quot;}]}}],&quot;background&quot;:false},{&quot;acf_fc_layout&quot;:&quot;numbers_block&quot;,&quot;title&quot;:&quot;Nos r\u00e9alisations dans le secteur de l\u2019\u00e9nergie et des ressources naturelles&quot;,&quot;numbers&quot;:[{&quot;number&quot;:&quot;380 MW&quot;,&quot;label&quot;:&quot;d\u2019\u00e9lectricit\u00e9&quot;},{&quot;number&quot;:&quot;39 %&quot;,&quot;label&quot;:&quot;d\u2019\u00e9nergie renouvelable&quot;},{&quot;number&quot;:&quot;658,7 Mds FCFA&quot;,&quot;label&quot;:&quot;investis&quot;}],&quot;button_link&quot;:false,&quot;background&quot;:true},{&quot;acf_fc_layout&quot;:&quot;content_block&quot;,&quot;content_blocks_container&quot;:[{&quot;acf_fc_layout&quot;:&quot;columns_content_layout&quot;,&quot;title&quot;:&quot;La BOAD au coeur des initiatives pour la s\u00e9curit\u00e9 \u00e9nerg\u00e9tique  en Afrique de l\u2019Ouest&quot;,&quot;left_contents&quot;:{&quot;content_elements&quot;:[{&quot;acf_fc_layout&quot;:&quot;text_component&quot;,&quot;text&quot;:&quot;&lt;h3&gt;L\u2019initiative r\u00e9gionale pour l\u2019\u00e9nergie durable (IRED)&lt;\/h3&gt;\n&lt;p&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;Afin de mieux faire face\u00a0 aux crises \u00e9nerg\u00e9tiques r\u00e9currentes dans plusieurs des Etats membres de l\u2019UEMOA, la Conf\u00e9rence des Chefs d\u2019Etat et de Gouvernement a d\u00e9cid\u00e9, en janvier 2008,\u00a0 de la mise en place d\u2019une commission pour proposer une strat\u00e9gie intitul\u00e9e \u00ab Initiative R\u00e9gionale pour l\u2019Energie Durable (IRED) \u00bb.&lt;\/span&gt;&lt;\/p&gt;\n&quot;}]},&quot;right_contents&quot;:{&quot;content_elements&quot;:[{&quot;acf_fc_layout&quot;:&quot;text_component&quot;,&quot;text&quot;:&quot;&lt;h3&gt;L\u2019IRED vise, \u00e0 l\u2019horizon 2030, un taux d\u2019acc\u00e8s de 100% \u00e0 l\u2019\u00e9lectricit\u00e9 dans l\u2019UEMOA.&lt;\/h3&gt;\n&lt;p&gt;En pratiquant des prix bas et dans le cadre d\u2019un vaste march\u00e9 d\u2019\u00e9changes d\u2019\u00e9nergie \u00e9lectrique int\u00e9gr\u00e9 et harmonis\u00e9 \u00e0 l\u2019\u00e9chelle de l\u2019Afrique de l\u2019Ouest. Ce march\u00e9 r\u00e9gional s\u2019appuierait sur un partenariat public-priv\u00e9 dynamique. L\u2019IRED cible \u00e9galement en 2030 un accroissement \u00e0 82% de la proportion des \u00e9nergies renouvelables et durables dans le parc de production \u00e9lectrique de l\u2019UEMOA.&lt;\/p&gt;\n&lt;p&gt;Le dispositif institutionnel et financier de mise en \u0153uvre de l\u2019IRED comprend notamment\u00a0 un Fonds de D\u00e9veloppement Energie (FDE), \u00e0 caract\u00e8re concessionnel ;\u00a0 et\u00a0 un fonds d\u2019investissement, le Fonds Infrastructures, de type priv\u00e9.&lt;\/p&gt;\n&quot;}]}}],&quot;background&quot;:false},{&quot;acf_fc_layout&quot;:&quot;content_block&quot;,&quot;content_blocks_container&quot;:[{&quot;acf_fc_layout&quot;:&quot;columns_content_layout&quot;,&quot;title&quot;:&quot;Le fonds de d\u00e9veloppement \u00e9nergie (FDE)&quot;,&quot;left_contents&quot;:{&quot;content_elements&quot;:[{&quot;acf_fc_layout&quot;:&quot;picture_component&quot;,&quot;picture_file&quot;:{&quot;ID&quot;:563964,&quot;id&quot;:563964,&quot;title&quot;:&quot;Le FDE&quot;,&quot;filename&quot;:&quot;le-fde.jpeg&quot;,&quot;filesize&quot;:87720,&quot;url&quot;:&quot;https:\/\/admin.boad.org\/wp-content\/uploads\/2024\/03\/le-fde.jpeg&quot;,&quot;link&quot;:&quot;https:\/\/admin.boad.org\/fr\/nos-secteurs-dintervention\/energie-et-ressources-naturelles\/le-fde\/&quot;,&quot;alt&quot;:&quot;Homme qui inspecte le r\u00e9seau \u00e9lectrique a\u00e9rien&quot;,&quot;author&quot;:&quot;1&quot;,&quot;description&quot;:&quot;&quot;,&quot;caption&quot;:&quot;Le FDE&quot;,&quot;name&quot;:&quot;le-fde&quot;,&quot;status&quot;:&quot;inherit&quot;,&quot;uploaded_to&quot;:563961,&quot;date&quot;:&quot;2024-03-27 14:00:24&quot;,&quot;modified&quot;:&quot;2024-03-27 14:00:32&quot;,&quot;menu_order&quot;:0,&quot;mime_type&quot;:&quot;image\/jpeg&quot;,&quot;type&quot;:&quot;image&quot;,&quot;subtype&quot;:&quot;jpeg&quot;,&quot;icon&quot;:&quot;https:\/\/admin.boad.org\/wp-includes\/images\/media\/default.png&quot;,&quot;width&quot;:1440,&quot;height&quot;:1080,&quot;sizes&quot;:{&quot;thumbnail&quot;:&quot;https:\/\/admin.boad.org\/wp-content\/uploads\/2024\/03\/le-fde-150x150.jpeg&quot;,&quot;thumbnail-width&quot;:150,&quot;thumbnail-height&quot;:150,&quot;medium&quot;:&quot;https:\/\/admin.boad.org\/wp-content\/uploads\/2024\/03\/le-fde-300x225.jpeg&quot;,&quot;medium-width&quot;:300,&quot;medium-height&quot;:225,&quot;medium_large&quot;:&quot;https:\/\/admin.boad.org\/wp-content\/uploads\/2024\/03\/le-fde-768x576.jpeg&quot;,&quot;medium_large-width&quot;:768,&quot;medium_large-height&quot;:576,&quot;large&quot;:&quot;https:\/\/admin.boad.org\/wp-content\/uploads\/2024\/03\/le-fde-1024x768.jpeg&quot;,&quot;large-width&quot;:1024,&quot;large-height&quot;:768,&quot;1536x1536&quot;:&quot;https:\/\/admin.boad.org\/wp-content\/uploads\/2024\/03\/le-fde.jpeg&quot;,&quot;1536x1536-width&quot;:1440,&quot;1536x1536-height&quot;:1080,&quot;2048x2048&quot;:&quot;https:\/\/admin.boad.org\/wp-content\/uploads\/2024\/03\/le-fde.jpeg&quot;,&quot;2048x2048-width&quot;:1440,&quot;2048x2048-height&quot;:1080}},&quot;picture_has_target_link&quot;:false,&quot;picture_target_link&quot;:null,&quot;orientation&quot;:&quot;default&quot;}]},&quot;right_contents&quot;:{&quot;content_elements&quot;:[{&quot;acf_fc_layout&quot;:&quot;text_component&quot;,&quot;text&quot;:&quot;&lt;p&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;Mis en place le 25 septembre 2009, le FDE a pour objet de contribuer \u00e0 l\u2019am\u00e9lioration de l\u2019acc\u00e8s \u00e0 l\u2019\u00e9nergie des Etats membres de l\u2019UEMOA et de promouvoir le d\u00e9veloppement durable de l\u2019\u00e9nergie en intervenant \u00e0 des conditions concessionnelles pour le financement de projets \u00e9ligibles \u00e0 l\u2019IRED. Sa gestion est assur\u00e9e par la BOAD.&lt;\/span&gt;&lt;\/p&gt;\n&lt;p&gt;&amp;nbsp;&lt;\/p&gt;\n&lt;p&gt;Le FDE a d\u00e9marr\u00e9 ses op\u00e9rations au cours du premier semestre de 2010. Au\u00a0 31 d\u00e9cembre 2016, 14\u00a0 projets d\u2019\u00e9nergie avaient \u00e9t\u00e9 financ\u00e9s sous forme de pr\u00eats au titre du FDE, pour un montant global de 229,7 milliards de FCFA.&lt;\/p&gt;\n&quot;}]}}],&quot;background&quot;:true},{&quot;acf_fc_layout&quot;:&quot;content_block&quot;,&quot;content_blocks_container&quot;:[{&quot;acf_fc_layout&quot;:&quot;simple_content_layout&quot;,&quot;title&quot;:&quot;Le fonds infrastructures&quot;,&quot;content_elements&quot;:{&quot;content_elements&quot;:[{&quot;acf_fc_layout&quot;:&quot;text_component&quot;,&quot;text&quot;:&quot;&lt;p&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;Il est d\u00e9di\u00e9 aux investissements priv\u00e9s. C\u2019est un fonds \u00e0 but lucratif, destin\u00e9 au financement des infrastructures d\u2019\u00e9lectricit\u00e9 dans l\u2019UEMOA, selon les termes et conditions du march\u00e9. Il vise en outre \u00e0 financer la restructuration des soci\u00e9t\u00e9s d\u2019\u00e9lectricit\u00e9, le programme d\u2019urgence et les projets \u00e0 moyen et long termes. Il constituera un levier pour les partenariats public-priv\u00e9 dans le secteur de l\u2019\u00e9lectricit\u00e9 en zone UEMOA. Les diligences relatives \u00e0 sa mise en place sont en cours au niveau de la BOAD.&lt;\/span&gt;&lt;\/p&gt;\n&quot;}]}}],&quot;background&quot;:false},{&quot;acf_fc_layout&quot;:&quot;content_block&quot;,&quot;content_blocks_container&quot;:[{&quot;acf_fc_layout&quot;:&quot;simple_content_layout&quot;,&quot;title&quot;:&quot;Objectif du Plan Djoliba 2021-2025&quot;,&quot;content_elements&quot;:{&quot;content_elements&quot;:[{&quot;acf_fc_layout&quot;:&quot;text_component&quot;,&quot;text&quot;:&quot;&lt;p class=\&quot;chiffre-number\&quot; style=\&quot;text-align: center;\&quot;&gt;380 MW&lt;\/p&gt;\n&quot;},{&quot;acf_fc_layout&quot;:&quot;text_component&quot;,&quot;text&quot;:&quot;&lt;p style=\&quot;text-align: center;\&quot;&gt;De capacit\u00e9 suppl\u00e9mentaire pour am\u00e9liorer le taux d\u2019\u00e9lectrification et la desserte \u00e9nerg\u00e9tique dans l\u2019UEMOA \u00e0 l\u2019horizon 2025&lt;\/p&gt;\ ot;,&quot;created_at&quot;:&quot;2024-04-30T09:31:17.000000Z&quot;,&quot;updated_at&quot;:&quot;2025-03-06T14:14:18.000000Z&quot;}}},{&quot;id&quot;:138,&quot;external_id&quot;:110,&quot;locale&quot;:&quot;fr&quot;,&quot;link&quot;:&quot;https:\/\/admin.boad.org\/fr\/domain\/environnement-finance-climat\/&quot;,&quot;name&quot;:&quot;Environnement et finance climat&quot;,&quot;description&quot;:&quot;&quot;,&quot;slug&quot;:&quot;environnement-finance-climat&quot;,&quot;taxonomy&quot;:&quot;domain&quot;,&quot;acf&quot;:[],&quot;count&quot;:null,&quot;page_id&quot;:1337,&quot;created_at&quot;:&quot;2024-04-30T09:30:35.000000Z&quot;,&quot;updated_at&quot;:&quot;2025-03-06T14:13:30.000000Z&quot;,&quot;page&quot;:{&quot;id&quot;:1337,&quot;external_id&quot;:563967,&quot;locale&quot;:&quot;fr&quot;,&quot;type&quot;:&quot;page&quot;,&quot;slug&quot;:&quot;environnement-finance-climat&quot;,&quot;status&quot;:&quot;publish&quot;,&quot;link&quot;:&quot;\/fr\/nos-secteurs-dintervention\/environnement-finance-climat\/&quot;,&quot;title&quot;:&quot;Environnement et Finance Climat&quot;,&quot;content&quot;:null,&quot;excerpt&quot;:null,&quot;acf&quot;:{&quot;page_type&quot;:&quot;simple&quot;,&quot;header&quot;:{&quot;title&quot;:null,&quot;text&quot;:null,&quot;domains_slider&quot;:false},&quot;page_blocks&quot;:[{&quot;acf_fc_layout&quot;:&quot;content_block&quot;,&quot;content_blocks_container&quot;:[{&quot;acf_fc_layout&quot;:&quot;columns_content_layout&quot;,&quot;title&quot;:&quot;Mot du Pr\u00e9sident&quot;,&quot;left_contents&quot;:{&quot;content_elements&quot;:[{&quot;acf_fc_layout&quot;:&quot;text_component&quot;,&quot;text&quot;:&quot;&lt;p&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;Il y a environ deux d\u00e9cennies, la Banque se dotait de ses premiers instruments en mati\u00e8re de gestion environnementale et sociale de ses projets. C\u2019\u00e9taient les pr\u00e9mices d\u2019une ambition r\u00e9affirm\u00e9e en mati\u00e8re de d\u00e9veloppement durable, int\u00e9gr\u00e9 et r\u00e9silient face aux probl\u00e8mes environnementaux que sont, notamment, la perte acc\u00e9l\u00e9r\u00e9e de la biodiversit\u00e9, la d\u00e9gradation des terres et les changements climatiques.&lt;\/span&gt;&lt;\/p&gt;\n&lt;p&gt;&amp;nbsp;&lt;\/p&gt;\n&lt;p&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;En 2020, la Banque a adopt\u00e9 une nouvelle Strat\u00e9gie \u00ab La Strat\u00e9gie Environnement et Climat 2021-2025 (SEC II) \u00bb qui fait \u00e9cho \u00e0 l\u2019une des missions principales que lui ont confi\u00e9es ses p\u00e8res fondateurs il y a une cinquantaine d\u2019ann\u00e9es, \u00e0 savoir faciliter le d\u00e9veloppement \u00e9quilibr\u00e9 des Etats membres de l\u2019UEMOA. La SEC II est en coh\u00e9rence avec les orientations de l\u2019Axe III du Plan DJOLIBA, \u00e0 savoir \u00ab le renforcement de la r\u00e9silience aux changements climatiques \u00bb.\u00a0&lt;\/span&gt;&lt;\/p&gt;\n&lt;p&gt;&amp;nbsp;&lt;\/p&gt;\n&lt;p&gt;&lt;!--more--&gt;&lt;\/p&gt;\n&lt;p style=\&quot;text-align: left;\&quot;&gt;A la lumi\u00e8re de l\u2019important d\u00e9ficit en financement et du besoin urgent d\u2019une action climatique plus forte avec des impacts durables et syst\u00e9matiques, j\u2019ai pris l\u2019engagement de consacrer 25% des financements de la Banque aux projets \u00e0 faibles \u00e9missions de carbone et r\u00e9silients aux changements climatiques. En outre, la BOAD renforcera son Syst\u00e8me de Gestion Environnementale et Sociale (SGES). Elle prendra \u00e9galement les mesures visant \u00e0 apporter des r\u00e9ponses concr\u00e8tes aux probl\u00e9matiques li\u00e9es \u00e0 la question du genre dans toutes ses op\u00e9rations pour promouvoir un d\u00e9veloppement durable.&lt;\/p&gt;\n&lt;p&gt;&amp;nbsp;&lt;\/p&gt;\n&lt;p style=\&quot;text-align: left;\&quot;&gt;Le leadership, le dialogue et la collaboration continue avec nos partenaires techniques et financiers impacteront plus significativement nos actions dans les prochaines ann\u00e9es en mati\u00e8res d\u2019environnement et de lutte contre les changements climatiques.&lt;\/p&gt;\n&lt;p&gt;&amp;nbsp;&lt;\/p&gt;\n&lt;p style=\&quot;text-align: left;\&quot;&gt;Je suis persuad\u00e9 que cette nouvelle strat\u00e9gie mettra la BOAD au c\u0153ur de l\u2019action climatique pour le d\u00e9veloppement durable de l\u2019UEMOA. Cette vision, qui orientera nos actions, est une responsabilit\u00e9 pour soutenir les besoins urgents et imminents de nos Etats membres, que nous mesurons, et \u00e0 laquelle nous sommes pr\u00e9par\u00e9s \u00e0 r\u00e9pondre.&lt;\/p&gt;\n&lt;p&gt;&amp;nbsp;&lt;\/p&gt;\n&lt;p style=\&quot;text-align: left;\&quot;&gt;&lt;strong&gt;SERGE EKUE&lt;br \/&gt;\n&lt;\/strong&gt;&lt;strong&gt;Pr\u00e9sident de la BOAD&lt;\/strong&gt;&lt;\/p&gt;&quot;}]},&quot;right_contents&quot;:{&quot;content_elements&quot;:[{&quot;acf_fc_layout&quot;:&quot;picture_component&quot;,&quot;picture_file&quot;:{&quot;ID&quot;:563969,&quot;id&quot;:563969,&quot;title&quot;:&quot;Le pr\u00e9sident&quot;,&quot;filename&quot;:&quot;mot-du-president.png&quot;,&quot;filesize&quot;:177672,&quot;url&quot;:&quot;https:\/\/admin.boad.org\/wp-content\/uploads\/2024\/03\/mot-du-president.png&quot;,&quot;link&quot;:&quot;https:\/\/admin.boad.org\/fr\/nos-secteurs-dintervention\/environnement-finance-climat\/mot-du-president\/&quot;,&quot;alt&quot;:null,&quot;author&quot;:&quot;1&quot;,&quot;description&quot;:null,&quot;caption&quot;:&quot;Le pr\u00e9sident&quot;,&quot;name&quot;:&quot;mot-du-president&quot;,&quot;status&quot;:&quot;inherit&quot;,&quot;uploaded_to&quot;:563967,&quot;date&quot;:&quot;2024-03-27 14:07:43&quot;,&quot;modified&quot;:&quot;2024-03-27 14:08:05&quot;,&quot;menu_order&quot;:0,&quot;mime_type&quot;:&quot;image\/png&quot;,&quot;type&quot;:&quot;image&quot;,&quot;subtype&quot;:&quot;png&quot;,&quot;icon&quot;:&quot;https:\/\/admin.boad.org\/wp-includes\/images\/media\/default.png&quot;,&quot;width&quot;:700,&quot;height&q ,&quot;medium_large-height&quot;:768,&quot;large&quot;:&quot;https:\/\/admin.boad.org\/wp-content\/uploads\/2024\/03\/crc-lome.jpeg&quot;,&quot;large-width&quot;:800,&quot;large-height&quot;:800,&quot;1536x1536&quot;:&quot;https:\/\/admin.boad.org\/wp-content\/uploads\/2024\/03\/crc-lome.jpeg&quot;,&quot;1536x1536-width&quot;:800,&quot;1536x1536-height&quot;:800,&quot;2048x2048&quot;:&quot;https:\/\/admin.boad.org\/wp-content\/uploads\/2024\/03\/crc-lome.jpeg&quot;,&quot;2048x2048-width&quot;:800,&quot;2048x2048-height&quot;:800}},&quot;button_link&quot;:{&quot;title&quot;:&quot;Voir Plus&quot;,&quot;url&quot;:&quot;https:\/\/www.boad.org\/fr\/le-centre-regional-de-collaboration-crc-de-lome\/&quot;,&quot;target&quot;:null}}}]},{&quot;acf_fc_layout&quot;:&quot;content_block&quot;,&quot;content_blocks_container&quot;:[{&quot;acf_fc_layout&quot;:&quot;columns_content_layout&quot;,&quot;title&quot;:&quot;Strat\u00e9gie environnement et Climat 2021-2025&quot;,&quot;left_contents&quot;:{&quot;content_elements&quot;:[{&quot;acf_fc_layout&quot;:&quot;text_component&quot;,&quot;text&quot;:&quot;&lt;p&gt;Les pays de l\u2019UEMOA figurent parmi les plus vuln\u00e9rables aux changements climatiques avec des cons\u00e9quences qui se traduisent, entre autres, par des augmentations de temp\u00e9ratures, des changements dans les r\u00e9gimes pluviom\u00e9triques, l\u2019occurrence plus fr\u00e9quente et plus intense d\u2019\u00e9v\u00e9nements climatiques extr\u00eames, la perte acc\u00e9l\u00e9r\u00e9e de la biodiversit\u00e9, la d\u00e9gradation des terres, l\u2019\u00e9l\u00e9vation du niveau de la mer, etc. Ces chocs climatiques sont d\u00e9vastateurs et menacent les perspectives de d\u00e9veloppement des Etats.&lt;\/p&gt;\n&lt;p&gt;&amp;nbsp;&lt;\/p&gt;\n&lt;p&gt;En effet, selon les projections \u00e0 l\u2019horizon 2050, &lt;strong&gt;une augmentation de temp\u00e9rature de &lt;\/strong&gt;&lt;strong&gt;1,5 \u00b0C induirait une baisse du PIB par habitant de 15 \u00e0 20% dans tous les pays de l\u2019UEMOA&lt;\/strong&gt; compar\u00e9e \u00e0 un sc\u00e9nario sans changement climatique. Au m\u00eame horizon temporel, la baisse du PIB par habitant due \u00e0 une augmentation de temp\u00e9rature de 3 \u00b0C serait d\u2019environ 30% dans plusieurs pays de l\u2019UEMOA.&lt;\/p&gt;\n&lt;p&gt;&amp;nbsp;&lt;\/p&gt;\n&lt;p&gt;La mise en \u0153uvre de la Strat\u00e9gie Environnement et Climat 2015-2019 de la BOAD a eu un impact positif sur la lutte contre le changement climatique dans les pays de l\u2019UEMOA. Durant cette p\u00e9riode, les engagements de la BOAD allou\u00e9s \u00e0 la finance climat sont estim\u00e9s \u00e0 228 milliards de FCFA dont 152 milliards pour l\u2019att\u00e9nuation, 32 milliards de FCFA pour l\u2019adaptation, 34 milliards pour l\u2019environnement et 10 milliards pour les projets att\u00e9nuation-adaptation.&lt;\/p&gt;&quot;}]},&quot;right_contents&quot;:{&quot;content_elements&quot;:[{&quot;acf_fc_layout&quot;:&quot;text_component&quot;,&quot;text&quot;:&quot;&lt;p&gt;Les efforts de la Banque pour diriger les flux financiers vers les enjeux environnementaux et climatiques de la zone UEMOA ont \u00e9galement progress\u00e9 gr\u00e2ce aux partenariats strat\u00e9giques d\u00e9velopp\u00e9s avec le Fonds pour l\u2019Environnement Mondial (FEM), le Fonds Vert pour le Climat (FVC) et le Fonds d\u2019Adaptation (FA), aupr\u00e8s desquels la BOAD a mobilis\u00e9 136 milliards de FCFA au 31\/07\/2023.&lt;\/p&gt;\n&lt;p&gt;&amp;nbsp;&lt;\/p&gt;\n&lt;p&gt;Dans le contexte de l\u2019Accord de Paris et de sa mise en \u0153uvre, les huit pays membres de l\u2019UEMOA ont pr\u00e9sent\u00e9 leurs Contributions D\u00e9termin\u00e9es au niveau National (CDN), repr\u00e9sentant leurs engagements \u00e0 r\u00e9duire les \u00e9missions nationales et \u00e0 s&amp;rsquo;adapter aux impacts du changement climatique.&lt;\/p&gt;\n&lt;p&gt;&amp;nbsp;&lt;\/p&gt;\n&lt;p&gt;Le co\u00fbt des actions programm\u00e9es dans ces CDN est estim\u00e9 \u00e0 environ 100 milliards de dollars US pour les pays de l\u2019UEMOA d\u2019ici 2030. Alors qu\u2019il reste moins de dix ans pour atteindre les Objectifs de d\u00e9veloppement durable (ODD) et les engagements des CDN, les pays membres de l\u2019UEMOA doivent imp\u00e9rativement acc\u00e9l\u00e9rer la mise en \u0153uvre des actions visant l\u2019adaptation et la r\u00e9silience au changement climatique.&lt;\/p&gt;\n&lt;p&gt;&amp;nbsp;&lt;\/p&gt;\n&lt;p&gt;A la lumi\u00e8re des \u00e9l\u00e9ments de contexte et des enjeux soulev\u00e9s, la nouvelle Strat\u00e9gie Environnement et Climat 2021-2025 (SEC II) a pour vision de positionner la BOAD au c\u0153ur de l\u2019action climatique pour le d\u00e9veloppement durable de l\u2019UEMOA. La SEC II refl\u00e8te l\u2019engagement de la Banque \u00e0 travers (05) axes d\u2019interventions strat\u00e9giques, dont trois axes op\u00e9rationnels et deux axes transversaux:&lt;\/p&gt;&quot;}]}}],&quot;background&quot;:true},{&quot;acf_fc_layout&quot;:&quot;content_block&quot;,&quot;content_blocks_container&quot;:[{&quot;acf_fc_layout&quot;:&quot;columns_content_layout&quot;,&quot;title&quot;:&quot;Les trois axes op\u00e9rationnels se traduisent par :&quot;,&quot;left_contents&quot;:{&quot;content_elements&quot;:[{&quot;acf_fc_layout&quot;:&quot;picture_component&quot;,&quot;picture_file&quot;:{&quot;ID&quot;:563971,&quot;id&quot;:563971,&quot;title&quot;:&quot;Axe-3&quot;,&quot;filename&quot;:&quot;axe-3.png&quot;,&quot;filesize&quot;:50260,&quot;url&quot;:&quot;https:\/\/admin.boad.org\/wp-content\/uploads\/2024\/03\/axe-3.png&quot;,&quot;link&quot;:&quot;https:\/\/admin.boad.org\/fr\/nos-secteurs-dintervention\/environnement-finance-climat\/axe-3\/&quot;,&quot;alt&quot;:null,&quot;author&quot;:&quot;1&quot;,&quot;description&quot;:null,&quot;caption&quot;:null,&quot;name&quot;:&quot;axe-3&quot;,&quot;status&quot;:&quot;inherit&quot;,&quot;uploaded_to&quot;:563967,&quot;date&quot;:&quot;2024-03-27 14:11:06&quot;,&quot;modi quot;id&quot;:139,&quot;external_id&quot;:112,&quot;locale&quot;:&quot;fr&quot;,&quot;link&quot;:&quot;https:\/\/admin.boad.org\/fr\/domain\/immobilier-habitat-social\/&quot;,&quot;name&quot;:&quot;Immobilier et habitat social&quot;,&quot;description&quot;:&quot;&quot;,&quot;slug&quot;:&quot;immobilier-habitat-social&quot;,&quot;taxonomy&quot;:&quot;domain&quot;,&quot;acf&quot;:[],&quot;count&quot;:null,&quot;page_id&quot;:1334,&quot;created_at&quot;:&quot;2024-04-30T09:30:35.000000Z&quot;,&quot;updated_at&quot;:&quot;2025-03-06T14:13:30.000000Z&quot;,&quot;page&quot;:{&quot;id&quot;:1334,&quot;external_id&quot;:563984,&quot;locale&quot;:&quot;fr&quot;,&quot;type&quot;:&quot;page&quot;,&quot;slug&quot;:&quot;immobilier-habitat-social&quot;,&quot;status&quot;:&quot;publish&quot;,&quot;link&quot;:&quot;\/fr\/nos-secteurs-dintervention\/immobilier-habitat-social\/&quot;,&quot;title&quot;:&quot;Immobilier &amp;#038; Habitat Social&quot;,&quot;content&quot;:&quot;&quot;,&quot;excerpt&quot;:&quot;&quot;,&quot;acf&quot;:{&quot;page_type&quot;:&quot;simple&quot;,&quot;header&quot;:{&quot;title&quot;:&quot;&quot;,&quot;text&quot;:&quot;Dans le secteur de l\u2019immobilier, la BOAD vise principalement \u00e0 favoriser la mixit\u00e9 sociale et \u00e0 soutenir le d\u00e9veloppement de la fili\u00e8re touristique.\r\n\r\nAu 30 juin 2024, les interventions de la BOAD dans le cadre de l\u2019appui \u00e0 l\u2019acc\u00e8s au logement abordable s\u2019\u00e9l\u00e8vent \u00e0 165,0 milliards FCFA et concernent le financement d\u2019une dizaine de projets dont le programme de 10 849 logements sociaux \u00e0 Ou\u00e8do au B\u00e9nin, le programme d&#039;urgence de 25 000 logements sociaux au Mali, le programme pr\u00e9sidentiel de 100 000 logements sociaux en C\u00f4te d&#039;ivoire. \r\n\r\nS\u2019agissant de l\u2019immobilier touristique et commercial, le montant total des projets financ\u00e9s r\u00e9partis dans tous les pays membres, ressort \u00e0 259,5585 milliards FCFA au 30 juin 2024. Il correspond \u00e0 (i) 24 r\u00e9ceptifs h\u00f4teliers construits ou r\u00e9nov\u00e9s, (ii) 6 projets de constructions\/r\u00e9habilitations de b\u00e2timents administratifs et (iii) 1 centre commercial. \r\n&quot;,&quot;domains_slider&quot;:false},&quot;page_blocks&quot;:[{&quot;acf_fc_layout&quot;:&quot;content_block&quot;,&quot;content_blocks_container&quot;:[{&quot;acf_fc_layout&quot;:&quot;columns_content_layout&quot;,&quot;title&quot;:&quot;L&#039;immobilier abordable&quot;,&quot;left_contents&quot;:{&quot;content_elements&quot;:[{&quot;acf_fc_layout&quot;:&quot;text_component&quot;,&quot;text&quot;:&quot;&lt;h4&gt;&lt;strong&gt;Objectifs :\u00a0&lt;\/strong&gt;&lt;\/h4&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;Favoriser l\u2019acc\u00e8s des populations aux ressources modestes et moyennes \u00e0 un logement d\u00e9cent.\u00a0&lt;\/span&gt;&lt;\/li&gt;\n&lt;li&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;Veiller \u00e0 ce que les logements disposent d\u2019un co\u00fbt abordable tout en maintenant des normes de qualit\u00e9 \u00e9lev\u00e9es.&lt;\/span&gt;&lt;\/li&gt;\n&lt;\/ul&gt;\n&lt;p&gt;&amp;nbsp;&lt;\/p&gt;\n&lt;h4&gt;&lt;strong&gt;Approche :\u00a0&lt;\/strong&gt;&lt;\/h4&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;Amplifier les financements pour combler le d\u00e9ficit de logements et accompagner la croissance et l\u2019\u00e9mergence des pays de l\u2019UEMOA.&lt;\/span&gt;&lt;\/li&gt;\n&lt;li&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;Appuyer les Etats, en faisant appel au secteur priv\u00e9 pour la conception, le financement, la construction de logements abordables.&lt;\/span&gt;&lt;\/li&gt;\n&lt;li&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;Accompagner les projets et programmes qui sont en coh\u00e9rence \u00e0 la fois avec les Strat\u00e9gies\/Programmes des Etats et le Plan Strat\u00e9gique 2021-2025, Djoliba, de la BOAD.&lt;\/span&gt;&lt;\/li&gt;\n&lt;\/ul&gt;\n&quot;}]},&quot;right_contents&quot;:{&quot;content_elements&quot;:[{&quot;acf_fc_layout&quot;:&quot;picture_component&quot;,&quot;picture_file&quot;:{&quot;ID&quot;:563986,&quot;id&quot;:563986,&quot;title&quot;:&quot;L&#039;immo abordable&quot;,&quot;filename&quot;:&quot;limmo-abordable.jpeg&quot;,&quot;filesize&quot;:220098,&quot;url&quot;:&quot;https:\/\/admin.boad.org\/wp-content\/uploads\/2024\/03\/limmo-abordable.jpeg&quot;,&quot;link&quot;:&quot;https:\/\/admin.boad.org\/fr\/nos-secteurs-dintervention\/immobilier-habitat-social\/l-immo-abordable\/&quot;,&quot;alt&quot;:&quot;Vue d&#039;une ville&quot;,&quot;author&quot;:&quot;1&quot;,&quot;description&quot;:&quot;&quot;,&quot;caption&quot;:&quot;L&#039;immo abordable&quot;,&quot;name&quot;:&quot;l-immo-abordable&quot;,&quot;status&quot;:&quot;inherit&quot;,&quot;uploaded_to&quot;:563984,&quot;date&quot;:&quot;2024-03-27 14:29:20&quot;,&quot;modified&quot;:&quot;2024-03-27 14:59:13&quot;,&quot;menu_order&quot;:0,&quot;mime_type&quot;:&quot;image\/jpeg&quot;,&quot;type&quot;:&quot;image&quot;,&quot;subtype&quot;:&quot;jpeg&quot;,&quot;icon&quot;:&quot;https:\/\/admin.boad.org\/wp-includes\/images\/media\/default.png&quot;,&quot;width&quot;:1440,&quot;height&quot;:1080,&quot;sizes&quot;:{&quot;thumbnail&quot;:&quot;https:\/\/admin.boad.org\/wp-content\/uploads\/2024\/03\/limmo-abordable-150x150.jpeg&quot;,&quot;thumbnail-width&quot;:150,&quot;thumbnail-height&quot;:150,&quot;medium&quot;:&quot;https:\/\/admin.boad.org\/wp-content\/uploads\/2024\/03\/limmo-abordable-300x225.jpeg&quot;,&quot;medium-width&quot;:300,&quot;medium-height&quot;:225,&quot;medium_large&quot;:&quot;https:\/\/admin.boad.org\/wp-content\/uploads\/2024\/03\/limmo-abordable-768x576.jpeg&quot;,&quot;medium_large-width&quot;:768,&quot;medium_large-height&quot;:576,&quot;large&quot;:&quot;https:\/\/admin.boad.org\/wp-content\/uploads\/2024\/03\/limmo-abordable-1024x768.jpeg&quot;,&quot;large-width&quot;:1024,&quot;large-height&quot;:768,&quot;1536x1536&quot;:&quot;https:\/\/admin.boad.org\/wp-content\/uploads\/2024\/03\/limmo-abordable.jpeg&quot;,&quot;1536x1536-width&quot;:1440,&quot;1536x1536-height&quot;:1080,&quot;2048x2048&quot;:&quot;https:\/\/admin.boad.org\/wp-content\/uploads\/2024\/03\/limmo-abordable.jpeg&quot;,&quot;2048x2048-width&quot;:1440,&quot;2048x2048-height&quot;:1080}},&quot;picture_has_target_link&quot;:false,&quot;picture_target_link&quot;:null,&quot;orientation&quot;:&quot;default&quot;}]}}],&quot;background&quot;:false},{&quot;acf_fc_layout&quot;:&quot;content_block&quot;,&quot;content_blocks_container&quot;:[{&quot;acf_fc_layout&quot;:&quot;columns_content_layout&quot;,&quot;title&quot;:&quot;Priorit\u00e9s d&#039;intervention dans le domaine du logement abordable&quot;,&quot;left_contents&quot;:{&quot;content_elements&quot;:[{&quot;acf_fc_layout&quot;:&quot;text_component&quot;,&quot;text&quot;:&quot;&lt;h4&gt;&lt;strong&gt;Appui au financement des \u00e9tudes et au montage de projets de construction de logements abordables&lt;\/strong&gt;&lt;\/h4&gt;\n&lt;p&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;La BOAD vise \u00e0 accompagner les \u00c9tats et le secteur priv\u00e9 en fournissant des ressources financi\u00e8res pour la r\u00e9alisation d&amp;rsquo;\u00e9tudes de faisabilit\u00e9 et le montage de projets de construction de logements abordables. Cela inclut la planification, la conception et l&amp;rsquo;analyse pr\u00e9liminaire des projets afin de garantir leur viabilit\u00e9 et leur alignement avec les besoins locaux.&lt;\/span&gt;&lt;\/p&gt;\n&lt;p&gt;&amp;nbsp;&lt;\/p&gt;\n&lt;h4&gt;&lt;strong&gt;Financement de la construction de logements abordables en zones urbaines&lt;\/strong&gt;&lt;\/h4&gt;\n&lt;p&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;Face \u00e0 l&amp;rsquo;augmentation g\u00e9n\u00e9ralis\u00e9e de la demande de logements en zones urbaines, la BOAD s&amp;rsquo;engage \u00e0 soutenir financi\u00e8rement la construction de logements abordables. Cela permet de r\u00e9pondre aux besoins urgents en mati\u00e8re de logement dans les zones o\u00f9 la pression d\u00e9mographique et urbaine est plus forte.&lt;\/span&gt;&lt;\/p&gt;\n&lt;p&gt;&amp;nbsp;&lt;\/p&gt;\n&lt;h4&gt;&lt;strong&gt;Promotion de la durabilit\u00e9 environnementale&lt;\/strong&gt;&lt;\/h4&gt;\n&lt;p&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;La BOAD met l&amp;rsquo;accent sur la construction de logements \u00e9conomes en \u00e9nergie et l&amp;rsquo;utilisation de mat\u00e9riaux durables. Elle encourage \u00e9galement l&amp;rsquo;adoption de pratiques de construction respectueuses de l&amp;rsquo;environnement, favorisant ainsi la r\u00e9duction de l&amp;#8217;empreinte carbone des logements construits et la pr\u00e9servation des \u00e9cosyst\u00e8mes. &lt;\/span&gt;&lt;\/p&gt;\n&quot;}]},&quot;right_contents&quot;:{&quot;content_elements&quot;:[{&quot;acf_fc_layout&quot;:&quot;text_component&quot;,&quot;text&quot;:&quot;&lt;h4&gt;&lt;strong&gt;Viabilisation des infrastructures essentielles&lt;\/strong&gt;&lt;\/h4&gt;\n&lt;p&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;Outre la construction de logements, la BOAD accorde une attention particuli\u00e8re \u00e0 la viabilisation des infrastructures essentielles telles que l&amp;rsquo;eau potable, l&amp;rsquo;assainissement, l&amp;rsquo;\u00e9lectricit\u00e9 et les transports. Cette approche contribue \u00e0 am\u00e9liorer la qualit\u00e9 de vie des r\u00e9sidents des logements abordables en leur fournissant un acc\u00e8s ad\u00e9quat \u00e0 ces services de base. De plus, ces investissements renforcent l&amp;rsquo;attractivit\u00e9 globale des zones de construction des logements.&lt;\/span&gt;&lt;\/p&gt;\n&lt;p&gt;&amp;nbsp;&lt;\/p&gt;\n&lt;h4&gt;&lt;strong&gt;Collaboration avec la Caisse R\u00e9gionale de Refinancement Hypoth\u00e9caire de l&amp;rsquo;UEMOA&lt;\/strong&gt;&lt;\/h4&gt;\n&lt;p&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;En partenariat avec la Caisse R\u00e9gionale de Refinancement Hypoth\u00e9caire de l&amp;rsquo;UEMOA, la BOAD travaille \u00e0 cr\u00e9er des conditions favorables pour permettre aux m\u00e9nages \u00e0 revenus modestes d&amp;rsquo;acc\u00e9der plus facilement \u00e0 un cr\u00e9dit immobilier. Cela contribue \u00e0 \u00e9largir l&amp;rsquo;acc\u00e8s \u00e0 la propri\u00e9t\u00e9 et \u00e0 encourager la construction de logements abordables pour cette cat\u00e9gorie de la population.&lt;\/span&gt;&lt;\/p&gt;\n&quot;}]}}],&quot;background&quot;:true},{&quot;acf_fc_layout&quot;:&quot;content_block&quot;,&quot;content_blocks_container&quot;:[{&quot;acf_fc_layout&quot;:&quot;columns_content_layout&quot;,&quot;title&quot;:&quot;H\u00f4tellerie et immobilier de standing&quot;,&quot;left_contents&quot;:{&quot;content_elements&quot;:[{&quot;acf_fc_layout&quot;:&quot;picture_component&quot;,&quot;picture_file&quot;:{&quot;ID&quot;:563987,&quot;id&quot;:563987,&quot;title&quot;:&quot;Hotellerie et immobilier de standing&quot;,&quot;filename&quot;:&quot;hotellerie-et-immobilier-de-standing.jpeg&quot;,&quot;filesize&quot;:267863,&quot;url&quot;:&quot;https:\/\/admin.boad.org\/wp-content\/uploads\/2024\/03\/hotellerie-et-immobilier-de-standing.jpeg&quot;,&quot;link&quot;:&quot;https:\/\/admin.boad.org\/fr\/nos-secteurs-dintervention\/immobilier-habitat-social\/hotellerie-et-immobilier-de-standing\/&quot;,&quot;alt&quot;:&quot;Grand h\u00f4tel&quot;,&quot;author&quot;:&quot;1&quot;,&quot;description&quot;:&quot;&quot;,&quot;caption&quot;:&quot;Hotellerie et immobilier de standing&quot;,&quot;name&quot;:&quot;hotellerie-et-immobilier-de-standing&quot;,&quot;status&quot;:&quot;inherit&quot;,&quot;uploaded_to&quot;:563984,&quot;date&quot;:&quot;2024-03-27 14:30:48&quot;,&quot;modified&quot;:&quot;2024-03-27 14:30:53&quot;,&quot;menu_order&quot;:0,&quot;mime_type&quot;:&quot;image\/jpeg&quot;,&quot;type&quot;:&quot;image&quot;,&quot;subtype&quot;:&quot;jpeg&quot;,&quot;icon&quot;:&quot;https:\/\/admin.boad.org\/wp-includes\/images\/media\/default.png&quot;,&quot;width&quot;:1440,&quot;height&quot;:1080,&quot;sizes&quot;:{&quot;thumbnail&quot;:&quot;https:\/\/admin.boad.org\/wp-content\/uploads\/2024\/03\/hotellerie-et-immobilier-de-standing-150x150.jpeg&quot;,&quot;thumbnail-width&quot;:150,&quot;thumbnail-height&quot;:150,&quot;medium&quot;:&quot;https:\/\/admin.boad.org\/wp-content\/uploads\/2024\/03\/hotellerie-et-immobilier-de-standing-300x225.jpeg&quot;,&quot;medium-width&quot;:300,&quot;medium-height&quot;:225,&quot;medium_large&quot;:&quot;https:\/\/admin.boad.org\/wp-content\/uploads\/2024\/03\/hotellerie-et-immobilier-de-standing-768x576.jpeg&quot;,&quot;medium_large-width&quot;:768,&quot;medium_large-height&quot;:576,&quot;large&quot;:&quot;https:\/\/admin.boad.org\/wp-content\/uploads\/2024\/03\/hotellerie-et-immobilier-de-standing-1024x768.jpeg&quot;,&quot;large-width&quot;:1024,&quot;large-height&quot;:768,&quot;1536x1536&quot;:&quot;https:\/\/admin.boad.org\/wp-content\/uploads\/2024\/03\/hotellerie-et-immobilier-de-standing.jpeg&quot;,&quot;1536x1536-width&quot;:1440,&quot;1536x1536-height&quot;:1080,&quot;2048x2048&quot;:&quot;https:\/\/admin.boad.org\/wp-content\/uploads\/2024\/03\/hotellerie-et-immobilier-de-standing.jpeg&quot;,&quot;2048x2048-width&quot;:1440,&quot;2048x2048-height&quot;:1080}},&quot;picture_has_target_link&quot;:false,&quot;picture_target_link&quot;:null,&quot;orientation&quot;:&quot;default&quot;}]},&quot;right_contents&quot;:{&quot;content_elements&quot;:[{&quot;acf_fc_layout&quot;:&quot;text_component&quot;,&quot;text&quot;:&quot;&lt;h4&gt;&lt;strong&gt;Objectifs :\u00a0&lt;\/strong&gt;&lt;\/h4&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;Consolider les interventions de la BOAD en faveur du secteur priv\u00e9 et accompagner les initiatives publiques dans le cadre de l\u2019\u00e9cotourisme et de l\u2019h\u00f4tellerie.&lt;\/span&gt;&lt;\/li&gt;\n&lt;li&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;Int\u00e9grer les enjeux climatiques \u00e0 travers la promotion des programmes de d\u00e9veloppement d\u2019\u00e9coquartier, de GreenBuilding et de villes vertes.&lt;\/span&gt;&lt;\/li&gt;\n&lt;\/ul&gt;\n&lt;p&gt;&amp;nbsp;&lt;\/p&gt;\n&lt;h4&gt;&lt;strong&gt;Approche :\u00a0&lt;\/strong&gt;&lt;\/h4&gt;\n&lt;ul&gt;\n&lt;li&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;Accompagner les grandes entreprises du BTP \u00e0 travers l\u2019identification de leurs besoins et des m\u00e9canismes de financement adapt\u00e9s.&lt;\/span&gt;&lt;\/li&gt;\n&lt;li&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;Int\u00e9grer le climat dans les op\u00e9rations de la Banque dans les secteurs touristiques et immobiliers&lt;\/span&gt;&lt;\/li&gt;\n&lt;\/ul&gt;\n&quot;}]}}],&quot;background&quot;:false},{&quot;acf_fc_layout&quot;:&quot;content_block&quot;,&quot;content_blocks_container&quot;:[{&quot;acf_fc_layout&quot;:&quot;columns_content_layout&quot;,&quot;title&quot;:&quot;Priorit\u00e9s d\u2019intervention dans les domaines de l\u2019h\u00f4tellerie de l\u2019immobilier de standing&quot;,&quot;left_contents&quot;:{&quot;content_elements&quot;:[{&quot;acf_fc_layout&quot;:&quot;text_component&quot;,&quot;text&quot;:&quot;&lt;h4&gt;&lt;strong&gt;Accompagner le secteur de l&amp;rsquo;h\u00f4tellerie dans le contexte post-COVID&lt;\/strong&gt;&lt;\/h4&gt;\n&lt;p&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;Suite aux perturbations caus\u00e9es par la pand\u00e9mie de COVID-19, la BOAD s&amp;rsquo;engage \u00e0 accompagner le secteur de l&amp;rsquo;h\u00f4tellerie pour sa relance et sa r\u00e9silience. Cela peut impliquer la mise en place de m\u00e9canismes de financement adapt\u00e9s pour aider les \u00e9tablissements h\u00f4teliers \u00e0 moderniser leurs installations, \u00e0 am\u00e9liorer les normes sanitaires et \u00e0 s&amp;rsquo;adapter aux nouvelles attentes des voyageurs en mati\u00e8re de s\u00e9curit\u00e9 et de confort.&lt;\/span&gt;&lt;\/p&gt;\n&lt;p&gt;&amp;nbsp;&lt;\/p&gt;\n&lt;h4&gt;&lt;strong&gt;Accompagner les grandes entreprises intervenant dans les secteurs de l&amp;rsquo;immobilier et du tourisme&lt;\/strong&gt;&lt;\/h4&gt;\n&lt;p&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;La BOAD vise \u00e0 soutenir les grandes entreprises op\u00e9rant dans les secteurs de l&amp;rsquo;immobilier et du tourisme en fournissant des financements pour des projets d&amp;rsquo;envergure. Cela peut inclure le d\u00e9veloppement de complexes touristiques, de centres de vill\u00e9giature et d&amp;rsquo;infrastructures immobili\u00e8res haut de gamme en r\u00e9ponse \u00e0 la demande croissante de logements de haut standing et d&amp;rsquo;espaces de loisirs.&lt;\/span&gt;&lt;\/p&gt;\n&lt;p&gt;&amp;nbsp;&lt;\/p&gt;\n&lt;h4&gt;&lt;strong&gt;Financer des projets d&amp;rsquo;\u00e9cotourisme&lt;\/strong&gt;&lt;\/h4&gt;\n&lt;p&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;La BOAD s&amp;rsquo;engage \u00e0 promouvoir le d\u00e9veloppement durable du tourisme. Les projets d&amp;rsquo;\u00e9cotourisme visent \u00e0 pr\u00e9server les ressources naturelles et culturelles tout en offrant des exp\u00e9riences touristiques uniques et respectueuses de l&amp;rsquo;environnement. Cette approche permettra de stimuler le tourisme tout en minimisant les impacts n\u00e9gatifs sur les \u00e9cosyst\u00e8mes locaux.&lt;\/span&gt;&lt;\/p&gt;\n&quot;}]},&quot;right_contents&quot;:{&quot;content_elements&quot;:[{&quot;acf_fc_layout&quot;:&quot;text_component&quot;,&quot;text&quot;:&quot;&lt;h4&gt;&lt;strong&gt;Financer des op\u00e9rations de construction de b\u00e2timents certifi\u00e9s EDGE&lt;\/strong&gt;&lt;\/h4&gt;\n&lt;p&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;La BOAD soutient la construction de b\u00e2timents r\u00e9pondant aux normes EDGE (Excellence in Design for Greater Efficiencies), qui visent \u00e0 r\u00e9duire la consommation d&amp;rsquo;\u00e9nergie, d&amp;rsquo;eau et d&amp;rsquo;autres ressources tout en optimisant la performance \u00e9cologique des b\u00e2timents. Cela contribuera \u00e0 la fois \u00e0 la r\u00e9duction des co\u00fbts op\u00e9rationnels des b\u00e2timents et \u00e0 la promotion de la durabilit\u00e9 environnementale.&lt;\/span&gt;&lt;\/p&gt;\n&lt;p&gt;&amp;nbsp;&lt;\/p&gt;\n&lt;h4&gt;&lt;strong&gt;Accompagner et promouvoir des programmes de d\u00e9veloppement d&amp;rsquo;\u00e9coquartiers, de Green Buildings et de villes vertes&lt;\/strong&gt;&lt;\/h4&gt;\n&lt;p&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;La BOAD soutient activement la mise en place de programmes visant \u00e0 d\u00e9velopper des \u00e9coquartiers, des b\u00e2timents respectueux de l&amp;rsquo;environnement (Green Buildings) et des villes vertes. Ces initiatives favorisent une urbanisation plus durable en int\u00e9grant des pratiques de construction \u00e9cologiques, une planification urbaine intelligente et des solutions d&amp;rsquo;efficacit\u00e9 \u00e9nerg\u00e9tique.&lt;\/span&gt;&lt;\/p&gt;\n&quot;}]}}],&quot;background&quot;:true},{&quot;acf_fc_layout&quot;:&quot;content_block&quot;,&quot;content_blocks_container&quot;:[{&quot;acf_fc_layout&quot;:&quot;columns_content_layout&quot;,&quot;title&quot;:&quot;Emannuel Cheick Oumar BARRY&quot;,&quot;left_contents&quot;:{&quot;content_elements&quot;:[{&quot;acf_fc_layout&quot;:&quot;text_component&quot;,&quot;text&quot;:&quot;&lt;p&gt;&lt;i&gt;Directeur du D\u00e9partement Sant\u00e9, Education et Immobilier&lt;\/i&gt;&lt;\/p&gt;\n&lt;p&gt;Adresse : 68 avenue de la Lib\u00e9ration, Lom\u00e9, Togo&lt;\/p&gt;\n&lt;p&gt;eMail :\u00a0ebarry@boad.org&lt;\/p&gt;\n&lt;p&gt;T\u00e9l\u00e9phone : +228 22 21 59 06 \/ +228 22 21 27 99&lt;\/p&gt;\n&quot;}]},&quot;right_contents&quot;:{&quot;content_elements&quot;:[{&quot;acf_fc_layout&quot;:&quot;picture_component&quot;,&quot;picture_file&quot;:{&quot;ID&quot;:563988,&quot;id&quot;:563988,&quot;title&quot;:&quot;Emannuel BARRY&quot;,&quot;filename&quot;:&quot;Emannuel- ontent\/uploads\/2024\/04\/Nos-objectifs-Sante\u2560u.jpg&quot;,&quot;1536x1536-width&quot;:1440,&quot;1536x1536-height&quot;:1080,&quot;2048x2048&quot;:&quot;https:\/\/admin.boad.org\/wp-content\/uploads\/2024\/04\/Nos-objectifs-Sante\u2560u.jpg&quot;,&quot;2048x2048-width&quot;:1440,&quot;2048x2048-height&quot;:1080}},&quot;picture_has_target_link&quot;:false,&quot;picture_target_link&quot;:null,&quot;orientation&quot;:&quot;default&quot;}]},&quot;right_contents&quot;:{&quot;content_elements&quot;:[{&quot;acf_fc_layout&quot;:&quot;text_component&quot;,&quot;text&quot;:&quot;&lt;ul&gt;\n&lt;li style=\&quot;font-weight: 400;\&quot; aria-level=\&quot;1\&quot;&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;Am\u00e9liorer l\u2019acc\u00e8s aux soins de sant\u00e9 de base \u00e0 toutes les populations&lt;\/span&gt;&lt;\/li&gt;\n&lt;li style=\&quot;font-weight: 400;\&quot; aria-level=\&quot;1\&quot;&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;Am\u00e9liorer les plateaux de diagnostic et interventionnels existants&lt;\/span&gt;&lt;\/li&gt;\n&lt;li style=\&quot;font-weight: 400;\&quot; aria-level=\&quot;1\&quot;&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;Accro\u00eetre l\u2019offre et r\u00e9duire le\u00a0 co\u00fbt des m\u00e9dicaments&lt;\/span&gt;&lt;\/li&gt;\n&lt;\/ul&gt;\n&quot;}]}}],&quot;background&quot;:true},{&quot;acf_fc_layout&quot;:&quot;content_block&quot;,&quot;content_blocks_container&quot;:[{&quot;acf_fc_layout&quot;:&quot;columns_content_layout&quot;,&quot;title&quot;:&quot;&quot;,&quot;left_contents&quot;:{&quot;content_elements&quot;:[{&quot;acf_fc_layout&quot;:&quot;text_component&quot;,&quot;text&quot;:&quot;&lt;h3&gt;Priorit\u00e9s d\u2019intervention dans le secteur de la sant\u00e9 :&lt;\/h3&gt;\n&lt;p&gt;La Banque Ouest-Africaine de D\u00e9veloppement (BOAD) s&amp;rsquo;engage fermement \u00e0 am\u00e9liorer les conditions de sant\u00e9 et le bien-\u00eatre des populations de la r\u00e9gion ouest-africaine en mettant en \u0153uvre une s\u00e9rie de priorit\u00e9s d&amp;rsquo;intervention dans le secteur de la sant\u00e9.&lt;\/p&gt;\n&lt;h4&gt;Renforcement des Syst\u00e8mes de Sant\u00e9&lt;\/h4&gt;\n&lt;p&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;En tant que pierre angulaire de notre action, la BOAD soutient les \u00c9tats membres dans l&amp;rsquo;am\u00e9lioration de leurs infrastructures sanitaires. Nous investissons dans la construction et la r\u00e9novation d&amp;rsquo;\u00e9tablissements de sant\u00e9, tout en fournissant des \u00e9quipements m\u00e9dicaux essentiels. Notre objectif est de renforcer la capacit\u00e9 des syst\u00e8mes de sant\u00e9 \u00e0 fournir des soins de qualit\u00e9 et \u00e0 r\u00e9pondre aux besoins de la population.&lt;\/span&gt;&lt;\/p&gt;\n&lt;h4&gt;R\u00e9ponse aux Urgences Sanitaires&lt;\/h4&gt;\n&lt;p&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;La BOAD s&amp;rsquo;engage \u00e0 d\u00e9velopper les capacit\u00e9s de r\u00e9ponse aux urgences sanitaires dans les pays de l&amp;rsquo;espace UEMOA. Nous collaborons avec les gouvernements pour mettre en place des m\u00e9canismes efficaces de r\u00e9ponse aux crises sanitaires, afin de prot\u00e9ger la sant\u00e9 publique en cas de pand\u00e9mies, d&amp;rsquo;\u00e9pid\u00e9mies ou autres situations d&amp;rsquo;urgence.&lt;\/span&gt;&lt;\/p&gt;\n&quot;}]},&quot;right_contents&quot;:{&quot;content_elements&quot;:[{&quot;acf_fc_layout&quot;:&quot;text_component&quot;,&quot;text&quot;:&quot;&lt;h4&gt;Soutien \u00e0 l&amp;rsquo;Entrepreneuriat et aux Professionnels de la Sant\u00e9&lt;\/h4&gt;\n&lt;p&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;Nous fournissons des ressources financi\u00e8res essentielles pour soutenir les initiatives des entrepreneurs et des professionnels de la sant\u00e9 priv\u00e9e. Nous encourageons la cr\u00e9ation de cliniques sp\u00e9cialis\u00e9es et d&amp;rsquo;\u00e9tablissements de sant\u00e9 innovants, contribuant ainsi \u00e0 diversifier l&amp;rsquo;offre de soins et \u00e0 am\u00e9liorer l&amp;rsquo;accessibilit\u00e9 aux services de sant\u00e9 de qualit\u00e9.&lt;\/span&gt;&lt;\/p&gt;\n&lt;h4&gt;Encouragement de l&amp;rsquo;Innovation&lt;\/h4&gt;\n&lt;p&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;La BOAD croit en la n\u00e9cessit\u00e9 de stimuler l&amp;rsquo;innovation dans les services de sant\u00e9. Nous soutenons la recherche et le d\u00e9veloppement de solutions novatrices pour am\u00e9liorer les soins de sant\u00e9, que ce soit par le biais de nouvelles technologies m\u00e9dicales, de mod\u00e8les de prestation de soins plus efficaces ou de programmes de formation avanc\u00e9e pour les professionnels de la sant\u00e9.&lt;\/span&gt;&lt;\/p&gt;\n&lt;p&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;La BOAD est r\u00e9solument engag\u00e9e \u00e0 promouvoir la sant\u00e9 en tant que pilier essentiel du d\u00e9veloppement \u00e9conomique et social de l&amp;rsquo;Afrique de l&amp;rsquo;Ouest. En collaborant avec les gouvernements, le secteur priv\u00e9 et les acteurs de la sant\u00e9, nous aspirons \u00e0 cr\u00e9er un impact positif durable et \u00e0 contribuer \u00e0 l&amp;rsquo;\u00e9dification d&amp;rsquo;une r\u00e9gion en meilleure sant\u00e9 et plus r\u00e9siliente.&lt;\/span&gt;&lt;\/p&gt;\n&quot;}]}}],&quot;background&quot;:false},{&quot;acf_fc_layout&quot;:&quot;content_block&quot;,&quot;content_blocks_container&quot;:[{&quot;acf_fc_layout&quot;:&quot;columns_content_layout&quot;,&quot;title&quot;:&quot;Nos objectifs dans le secteur de l&#039;\u00e9ducation&quot;,&quot;left_contents&quot;:{&quot;content_elements&quot;:[{&quot;acf_fc_layout&quot;:&quot;text_component&quot;,&quot;text&quot;:&quot;&lt;ul&gt;\n&lt;li style=\&quot;font-weight: 400;\&quot; aria-level=\&quot;1\&quot;&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;Augmenter les taux de scolarisation \u00e0 tous les niveaux du pr\u00e9scolaire au sup\u00e9rieur&lt;\/span&gt;&lt;\/li&gt;\n&lt;li style=\&quot;font-weight: 400;\&quot; aria-level=\&quot;1\&quot;&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;Am\u00e9liorer la pertinence et la qualit\u00e9 du syst\u00e8me \u00e9ducatif&lt;\/span&gt;&lt;\/li&gt;\n&lt;li style=\&quot;font-weight: 400;\&quot; aria-level=\&quot;1\&quot;&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;R\u00e9duire les in\u00e9galit\u00e9s de genre en termes d\u2019acc\u00e8s \u00e0 l\u2019\u00e9ducation&lt;\/span&gt;&lt;\/li&gt;\n&lt;\/ul&gt;\n&quot;}]},&quot;right_contents&quot;:{&quot;content_elements&quot;:[{&quot;acf_fc_layout&quot;:&quot;picture_component&quot;,&quot;picture_file&quot;:{&quot;ID&quot;:564144,&quot;id&quot;:564144,&quot;title&quot;:&quot;Nos objectifs \u00e9ducation&quot;,&quot;filename&quot;:&quot;Nos-objectifs-E\u2560uducation.jpg&quot;,&quot;filesize&quot;:85094,&quot;url&quot;:&quot;https:\/\/admin.boad.org\/wp-content\/uploads\/2024\/04\/Nos-objectifs-E\u2560uducation.jpg&quot;,&quot;link&quot;:&quot;https:\/\/admin.boad.org\/fr\/nos-secteurs-dintervention\/sante-et-education\/nos-objectifs-education\/&quot;,&quot;alt&quot;:&quot;&quot;,&quot;author&quot;:&quot;4&quot;,&quot;description&quot;:&quot;&quot;,&quot;caption&quot;:&quot;&quot;,&quot;name&quot;:&quot;nos-objectifs-education&quot;,&quot;status&quot;:&quot;inherit&quot;,&quot;uploaded_to&quot;:564053,&quot;date&quot;:&quot;2024-04-01 14:03:35&quot;,&quot;modified&quot;:&quot;2024-04-01 21:13:25&quot;,&quot;menu_order&quot;:0,&quot;mime_type&quot;:&quot;image\/jpeg&quot;,&quot;type&quot;:&quot;image&quot;,&quot;subtype&quot;:&quot;jpeg&quot;,&quot;icon&quot;:&quot;https:\/\/admin.boad.org\/wp-includes\/images\/media\/default.png&quot;,&quot;width&quot;:1440,&quot;height&quot;:1080,&quot;sizes&quot;:{&quot;thumbnail&quot;:&quot;https:\/\/admin.boad.org\/wp-content\/uploads\/2024\/04\/Nos-objectifs-E\u2560uducation-150x150.jpg&quot;,&quot;thumbnail-width&quot;:150,&quot;thumbnail-height&quot;:150,&quot;medium&quot;:&quot;https:\/\/admin.boad.org\/wp-content\/uploads\/2024\/04\/Nos-objectifs-E\u2560uducation-300x225.jpg&quot;,&quot;medium-width&quot;:300,&quot;medium-height&quot;:225,&quot;medium_large&quot;:&quot;https:\/\/admin.boad.org\/wp-content\/uploads\/2024\/04\/Nos-objectifs-E\u2560uducation-768x576.jpg&quot;,&quot;medium_large-width&quot;:768,&quot;medium_large-height&quot;:576,&quot;large&quot;:&quot;https:\/\/admin.boad.org\/wp-content\/uploads\/2024\/04\/Nos-objectifs-E\u2560uducation-1024x768.jpg&quot;,&quot;large-width&quot;:1024,&quot;large-height&quot;:768,&quot;1536x1536&quot;:&quot;https:\/\/admin.boad.org\/wp-content\/uploads\/2024\/04\/Nos-objectifs-E\u2560uducation.jpg&quot;,&quot;1536x1536-width&quot;:1440,&quot;1536x1536-height&quot;:1080,&quot;2048x2048&quot;:&quot;https:\/\/admin.boad.org\/wp-content\/uploads\/2024\/04\/Nos-objectifs-E\u2560uducation.jpg&quot;,&quot;2048x2048-width&quot;:1440,&quot;2048x2048-height&quot;:1080}},&quot;picture_has_target_link&quot;:false,&quot;picture_target_link&quot;:null,&quot;orientation&quot;:&quot;default&quot;}]}}],&quot;background&quot;:true},{&quot;acf_fc_layout&quot;:&quot;content_block&quot;,&quot;content_blocks_container&quot;:[{&quot;acf_fc_layout&quot;:&quot;columns_content_layout&quot;,&quot;title&quot;:&quot;&quot;,&quot;left_contents&quot;:{&quot;content_elements&quot;:[{&quot;acf_fc_layout&quot;:&quot;text_component&quot;,&quot;text&quot;:&quot;&lt;h3&gt;Priorit\u00e9s d\u2019intervention dans le secteur de l&amp;rsquo;\u00e9ducation :&lt;\/h3&gt;\n&lt;p&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;La Banque Ouest-Africaine de D\u00e9veloppement (BOAD) consid\u00e8re l&amp;rsquo;\u00e9ducation comme un pilier fondamental du d\u00e9veloppement durable de la r\u00e9gion ouest-africaine. Pour atteindre cet objectif, la BOAD a \u00e9tabli des priorit\u00e9s d&amp;rsquo;intervention dans le secteur de l&amp;rsquo;\u00e9ducation qui refl\u00e8tent son engagement envers l&amp;rsquo;am\u00e9lioration de l&amp;rsquo;acc\u00e8s, de la qualit\u00e9, de l&amp;rsquo;\u00e9quit\u00e9 et de la r\u00e9silience de l&amp;rsquo;\u00e9ducation dans la r\u00e9gion.&lt;\/span&gt;&lt;\/p&gt;\n&lt;h4&gt;Appui aux \u00c9tats dans le respect des engagements pris en mati\u00e8re d\u2019acc\u00e8s universel et \u00e9quitable \u00e0 l\u2019\u00e9ducation pour tous&lt;\/h4&gt;\n&lt;p&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;La BOAD s&amp;rsquo;engage \u00e0 travailler en \u00e9troite collaboration avec les \u00c9tats membres de l\u2019UEMOA pour garantir que chaque enfant ait un acc\u00e8s \u00e9gal et \u00e9quitable \u00e0 une \u00e9ducation de qualit\u00e9, conform\u00e9ment aux objectifs internationaux en mati\u00e8re d&amp;rsquo;\u00e9ducation.&lt;\/span&gt;&lt;\/p&gt;\n&lt;h4&gt;Soutien aux initiatives visant \u00e0 am\u00e9liorer la qualit\u00e9 de l\u2019\u00e9ducation&lt;\/h4&gt;\n&lt;p&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;La BOAD reconna\u00eet que l&amp;rsquo;acc\u00e8s \u00e0 l&amp;rsquo;\u00e9ducation ne suffit pas, et elle s&amp;rsquo;efforce d&amp;rsquo;am\u00e9liorer la qualit\u00e9 de l&amp;rsquo;\u00e9ducation \u00e0 travers la r\u00e9gion. Cela implique la formation des enseignants, le d\u00e9veloppement de programmes d&amp;rsquo;\u00e9tudes pertinents, et l&amp;rsquo;int\u00e9gration de technologies \u00e9ducatives innovantes pour renforcer l&amp;rsquo;apprentissage.&lt;\/span&gt;&lt;\/p&gt;\n&quot;}]},&quot;right_contents&quot;:{&quot;content_elements&quot;:[{&quot;acf_fc_layout&quot;:&quot;text_component&quot;,&quot;text&quot;:&quot;&lt;h4&gt;Promotion de l\u2019\u00e9galit\u00e9 de genre dans l\u2019acc\u00e8s \u00e0 l\u2019\u00e9ducation&lt;\/h4&gt;\n&lt;p&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;La BOAD accorde une attention particuli\u00e8re \u00e0 la promotion de l&amp;rsquo;\u00e9galit\u00e9 de genre dans le secteur de l&amp;rsquo;\u00e9ducation. Elle travaille \u00e0 \u00e9liminer les disparit\u00e9s entre les sexes en mati\u00e8re d&amp;rsquo;acc\u00e8s \u00e0 l&amp;rsquo;\u00e9ducation, en encourageant la participation des filles et des femmes dans tous les niveaux d&amp;rsquo;enseignement.&lt;\/span&gt;&lt;\/p&gt;\n&lt;h4&gt;Soutien \u00e0 la construction d\u2019infrastructures \u00e9ducatives pour les populations vuln\u00e9rables&lt;\/h4&gt;\n&lt;p&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;La BOAD investit dans la construction et la r\u00e9novation d&amp;rsquo;infrastructures \u00e9ducatives, en mettant l&amp;rsquo;accent sur les zones rurales et les populations vuln\u00e9rables qui ont souvent un acc\u00e8s limit\u00e9 \u00e0 des \u00e9coles de qualit\u00e9. L&amp;rsquo;objectif est de cr\u00e9er un environnement d&amp;rsquo;apprentissage favorable pour tous.&lt;\/span&gt;&lt;\/p&gt;\n&lt;h4&gt;D\u00e9veloppement des capacit\u00e9s de r\u00e9ponse face aux crises sociales, politiques, et climatiques&lt;\/h4&gt;\n&lt;p&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;La BOAD reconna\u00eet les d\u00e9fis auxquels la r\u00e9gion est confront\u00e9e en mati\u00e8re de crises sociales, politiques, et climatiques, et elle s&amp;rsquo;engage \u00e0 renforcer la r\u00e9silience du secteur de l&amp;rsquo;\u00e9ducation face \u00e0 ces d\u00e9fis. Cela comprend la mise en place de m\u00e9canismes d&amp;rsquo;urgence pour maintenir l&amp;rsquo;acc\u00e8s \u00e0 l&amp;rsquo;\u00e9ducation pendant les crises, ainsi que le d\u00e9veloppement de pratiques durables pour faire face aux enjeux climatiques.&lt;\/span&gt;&lt;\/p&gt;\n&lt;p&gt;&lt;span style=\&quot;font-weight: 400;\&quot;&gt;En mettant en \u0153uvre ces priorit\u00e9s d&amp;rsquo;intervention, la BOAD vise \u00e0 contribuer de mani\u00e8re significative \u00e0 l&amp;rsquo;am\u00e9lioration de l&amp;rsquo;\u00e9ducation dans la r\u00e9gion ouest-africaine, favorisant ainsi le d\u00e9veloppement humain et \u00e9conomique durable.&lt;\/span&gt;&lt;\/p&gt;\n&quot;}]}}],&quot;background&quot;:false},{&quot;acf_fc_layout&quot;:&quot;content_block&quot;,&quot;content_block
