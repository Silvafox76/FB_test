[project]
name = "pfm-opportunity-monitor"
version = "0.1.0"
description = "Reads public procurement and donor notices, scores them against the FreeBalance PFM function map, stages candidates for a named human reviewer."
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=0.40",
    "fastapi>=0.115",
    "httpx>=0.27",
    "jinja2>=3.1",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "rapidfuzz>=3.10",
    "selectolax>=0.3.21",
    "structlog>=24.4",
    "uvicorn>=0.32",
]

[project.scripts]
monitor = "monitor.cli:main"

[dependency-groups]
dev = [
    # Read once, by scripts/export_function_map.py, to generate config/function_map.yaml
    # from the component map workbook. Nothing at runtime opens a spreadsheet.
    "openpyxl>=3.1",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["monitor", "review"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "contract: runs a connector parser against a recorded fixture",
    "roles: requires a live Postgres with the two runtime roles applied",
    "golden: requires a labelled golden set and a model route",
]
