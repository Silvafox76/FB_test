# Sales regions and country ownership. Draft from FreeBalance_Sales_Regions_&_Countries_DRAFT.xlsx,
# 19 Sept 2026. One file is the single source for region membership: the stager, the review
# app's region filter, user region assignments and the metrics all read it. Geography weights
# stay in thresholds.yaml. Every ISO 3166 alpha-2 code appears exactly once, in a region, in
# `excluded`, or in `unassigned`; a test asserts it. Codes are quoted because bare NO is a
# YAML 1.1 boolean.
#
# status: inactive    exists for users, routing and reporting; no sources, notices held at the filter
#         onboarding  source inventory and ToS work; no connector code
#         build       connectors enabled one by one; candidates staged for testing, not worked
#         shadow      queue worked daily; exports are dry runs only
#         live        export batches released to BD
# At most one region is in build or shadow at a time; a test asserts it. The order regions come
# online is in docs/regional_rollout.md (decision 65), not here.
#
# Held in docs/ until step 22b (BUILD_ORDER.md) moves it to config/regions.yaml. It cannot sit in
# config/ before then: the registry refuses any config file without a CONFIG_KINDS entry (rule 6),
# so `make up` would fail. Until 22b, config/thresholds.yaml's `regions:` block drives the stager.

