# Two hooks and no more: lint, and a secret scan. gitleaks over detect-secrets
# because it ships provider rules (Anthropic, AWS, generic API keys) that catch a
# pasted key without a baseline file to maintain. One scanner, not two (rule 1).
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=4096]  # the component map workbook is 3.3 MB and is a source of record
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-json
      # Recorded fixtures are evidence of what a source actually returned. A hook
      # that rewrites one makes the diff lie about the API, so the two whitespace
      # fixers skip them. Size and JSON validity are still checked above.
      - id: end-of-file-fixer
        exclude: ^tests/contract/fixtures/
      - id: trailing-whitespace
        exclude: ^tests/contract/fixtures/
