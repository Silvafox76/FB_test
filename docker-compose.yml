# Four services now: postgres, pipeline, review, and browser (BUILD_ORDER step 17).
# Two Dockerfiles, because the browser service is the only one that carries a
# Chromium and the whole point of it is that the other two do not.
#
# Nothing here exposes an inbound network path off the host: Postgres and the review
# app both bind to 127.0.0.1 only, and the browser service publishes no port at all
# and listens for nothing (rule 17).

services:
  postgres:
    # pgvector is installed but unused this phase; it is here so step 29 does not
    # need a database rebuild if the cross-language duplicate rate says build it.
    image: pgvector/pgvector:pg16
    container_name: monitor-postgres
    environment:
      POSTGRES_DB: monitor
      POSTGRES_USER: monitor_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - monitor_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U monitor_owner -d monitor"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  pipeline:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: monitor-pipeline
    command: ["python", "-m", "monitor.cli", "status"]
    env_file: .env
    environment:
      DATABASE_URL_PIPELINE: postgresql://monitor_pipeline:${MONITOR_PIPELINE_PASSWORD:?set MONITOR_PIPELINE_PASSWORD in .env}@postgres:5432/monitor
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./sources:/app/sources:ro
      - ./config:/app/config:ro
      - ./logs:/app/logs
      - ./storage:/app/storage
    restart: "no"

  browser:
    # The browser sources and nothing else. It runs the same CLI as `pipeline` and
    # writes to the same database as the same `monitor_pipeline` role: it is a second
    # runtime for a different transport, not a second privilege (rule 11).
    #
    # `restart: "no"` and a status default, like `pipeline`: both are run on a
    # schedule by the host, not left looping. The schedule for a browser source is in
    # its registry entry like every other source's.
    build:
      context: .
      dockerfile: Dockerfile.browser
    container_name: monitor-browser
    command: ["python", "-m", "monitor.cli", "status"]
    env_file: .env
    environment:
      DATABASE_URL_PIPELINE: postgresql://monitor_pipeline:${MONITOR_PIPELINE_PASSWORD:?set MONITOR_PIPELINE_PASSWORD in .env}@postgres:5432/monitor
      MONITOR_BROWSER: "1"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./sources:/app/sources:ro
      - ./config:/app/config:ro
      - ./logs:/app/logs
      - ./storage:/app/storage
    # Chromium needs more than the default 64 MB of /dev/shm and crashes partway
    # through a render without it, which would surface as a torn page rather than as
    # an out-of-memory error.
    shm_size: "1gb"
    restart: "no"

  review:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: monitor-review
    command: ["uvicorn", "review.app:app", "--host", "0.0.0.0", "--port", "8080"]
    env_file: .env
    environment:
      DATABASE_URL_REVIEW: postgresql://monitor_review:${MONITOR_REVIEW_PASSWORD:?set MONITOR_REVIEW_PASSWORD in .env}@postgres:5432/monitor
    ports:
      # Published on the loopback interface only. The binding is the access control
      # for the pilot; there is no auth on the review app (BUILD_ORDER step 10).
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./config:/app/config:ro
      - ./exports:/app/exports
    restart: unless-stopped

volumes:
  monitor_pgdata:
    name: monitor_pgdata
