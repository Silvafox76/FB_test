# Every number the scorer, the filter and the stager read. A threshold, a weight or
# a CPV prefix hardcoded in a .py file is a finding (rule 6). Changing one of these
# is a config change with a version history, never a deployment.

# A candidate below this never reaches the review queue. 60 in shadow mode.
stage_threshold: 60

# At most this many candidates from one source reach the queue in one day, counted
# on the primary notice's source. It bounds reviewer load when a portal publishes a
# hundred notices at once; the rest stay at status 'scored' and are not lost.
per_source_daily_cap: 15

# Scores in this band are re-scored on a larger model at step 20. The band is the
# region where the small model's own confidence is worth a second opinion.
rescore_band: [40, 70]

# Multiplies the model's relevance for the country the notice was published in.
# West Africa is the pilot's priority market, the Balkans and Ukraine are the
# secondary one, and everything else is the long tail worth reading but not
# chasing. CLAUDE.md, Domain notes.
geography:
  # West Africa, 1.0
  BJ: 1.0   # Benin
  BF: 1.0   # Burkina Faso
  CI: 1.0   # Côte d'Ivoire
  GM: 1.0   # The Gambia
  GH: 1.0   # Ghana
  LR: 1.0   # Liberia
  ML: 1.0   # Mali
  MR: 1.0   # Mauritania
  NE: 1.0   # Niger
  NG: 1.0   # Nigeria
  SN: 1.0   # Senegal
  SL: 1.0   # Sierra Leone
  TG: 1.0   # Togo
  # Ukraine and the Western Balkans, 0.8
  UA: 0.8   # Ukraine
  AL: 0.8   # Albania
  BA: 0.8   # Bosnia and Herzegovina
  XK: 0.8   # Kosovo, which uses XK
  ME: 0.8   # Montenegro
  MK: 0.8   # North Macedonia
  # EU, EEA, UK and Switzerland, and anything else a source carries
  default: 0.6

# Which region a country belongs to. Used for the review queue's region filter
# (step 10) and for the Industry field in the export (appendix E), so the names
# here have to match the keys in config/record_defaults.yaml's industry_by_region.
# A country with a geography weight and no region is a gap; a test asserts they
# agree rather than leaving it to be noticed later.
regions:
  BJ: West Africa
  BF: West Africa
  CI: West Africa
  GM: West Africa
  GH: West Africa
  LR: West Africa
  ML: West Africa
  MR: West Africa
  NE: West Africa
  NG: West Africa
  SN: West Africa
  SL: West Africa
  TG: West Africa
  UA: Balkans and Ukraine
  AL: Balkans and Ukraine
  BA: Balkans and Ukraine
  XK: Balkans and Ukraine
  ME: Balkans and Ukraine
  MK: Balkans and Ukraine
  # The 0.6 band, enumerated. CLAUDE.md's domain notes define it as "EU, EEA, UK, CH",
  # and until now it was not listed here at all - every one of these countries reached
  # the region 'Europe' only by falling through `default`. That worked, and it hid the
  # problem below: a default that is load-bearing for 32 real countries cannot also be
  # the safe answer for a country nobody scoped.
  AT: Europe
  BE: Europe
  BG: Europe
  HR: Europe
  CY: Europe
  CZ: Europe
  DK: Europe
  EE: Europe
  FI: Europe
  FR: Europe
  DE: Europe
  GR: Europe
  HU: Europe
  IE: Europe
  IT: Europe
  IS: Europe
  LV: Europe
  LI: Europe
  LT: Europe
  LU: Europe
  MT: Europe
  NL: Europe
  # Quoted, and it must stay quoted. Bare NO is a BOOLEAN in YAML 1.1, so `NO: Europe`
  # parses as `False: Europe` and Norway silently falls through to the default. It did,
  # for about a minute, while this block was being written. ON, OFF, YES, TRUE and FALSE
  # are the same trap; NO is the only ISO 3166 code that collides. A test in
  # tests/unit/test_registry.py asserts every key in this file parses as a string.
  "NO": Europe
  PL: Europe
  PT: Europe
  RO: Europe
  SK: Europe
  SI: Europe
  ES: Europe
  SE: Europe
  GB: Europe
  CH: Europe
  # Everything else. It is NOT "Europe", and it used to be.
  #
  # `regions` fills two things: the reviewer's region filter, and - through
  # `industry_by_region` in config/record_defaults.yaml - the Industry column of the
  # Zoho export. The codes above are the pilot's entire scored geography, so a country
  # reaching this default is by definition one nobody scoped. Calling that 'Europe'
  # filed an Angolan or Kenyan notice as a European opportunity and exported it as
  # one: a plausible-looking invented value of exactly the kind appendix E forbids.
  #
  # Latent today rather than live. `monitor/connectors/worldbank.py` queries by the
  # registry's `covers` list and raises on any country outside it, so no unweighted
  # country has ever arrived. It stops being latent the moment a source is added
  # whose reach is not enumerated that way. `industry_by_region` carries its own
  # `default: "TBD"`, so such a notice now exports the honest placeholder.
  default: Out of scope

# CPV top-level codes that survive the free filter: 48 software, 72 IT services,
# 79 business and consultancy. A notice that carries CPV codes and none of these is
# dropped before any model call. A notice with no CPV code at all goes on to the
# lexicon stage; absence is not a failed match.
cpv_pass_prefixes: ["48", "72", "79"]

# Every model call is capped and logged (rule 22). The caps are per day, checked
# before each call, and a run that would exceed either stops with an event rather
# than trimming its work quietly.
# Raised from 600 on 2026-09-12. One day of TED needed 1,132 translate calls
# against a 600 cap, so a single source was 532 calls over and the backlog grew
# every day. The cost cap is the one that protects the budget and it is untouched:
# 2,000 Haiku calls of this shape is about USD 8, still inside the USD 25 cap, and
# the cap that binds is therefore the one denominated in the thing anyone actually
# cares about. Excluding award notices at the TED query (sources/ted.yaml) cut the
# same backlog by 43% in the same change, so both halves of the problem moved.
daily_call_cap: 2000
daily_usd_cap: 25

# Rate card, USD per million tokens. Used to compute a call's cost from its own
# token counts, because the API does not return a price. Update when Anthropic's
# published rates change; the number is here rather than in a .py file so that is
# a config edit with a version history (rule 6).
rate_card:
  claude-haiku-4-5:
    input: 1.00
    output: 5.00
  claude-sonnet-5:
    input: 2.00
    output: 10.00
  # A cache read is billed at a tenth of the input rate; writing the cache costs a
  # quarter more than fresh input. Both are needed to reconstruct a bill: the
  # scorer caches a ~7,500-token system block, so on a run of any length the cache
  # components are most of what was actually paid.
  cache_read_factor: 0.1
  cache_write_factor: 1.25

# How much of a notice body reaches the scorer. Architecture v0.4 section 8 says
# "the first 3,000 tokens of body text"; this is that budget in characters, because
# counting tokens exactly would mean a count_tokens call per notice and double the
# call count against the 600-a-day cap for no gain. Roughly four characters per
# token for Latin scripts and fewer for Cyrillic, so this errs on the side of
# sending less rather than more.
score_body_chars: 12000

# How much of a notice body reaches the TRANSLATOR. Deliberately the same number as
# score_body_chars, and the reason is not symmetry: the scorer never reads past its
# own cap, so translating further is money spent on English nobody will ever look at.
#
# It is also a correctness fix and not only a saving. The translator asks for JSON
# and caps the response at 4,096 output tokens; a body long enough to need more comes
# back as a string cut off mid-token, which fails JSON parsing rather than arriving
# short. Measured on a real call: an 8,160-character body produced 1,947 output
# tokens, so roughly a quarter of an output token per input character, and the
# longest body in the database (54,631 characters) would need about 13,000. Capping
# the input is what keeps the output inside the limit.
translate_body_chars: 12000

# The character count at or above which a PDF is read as born digital rather than
# sent to OCR (BUILD_ORDER step 18). Measured on the poppler text layer with
# `pdftotext -layout`, after stripping.
#
# A born-digital weekly bulletin runs to tens of thousands of characters and a true
# scan yields nought, so almost any number between them separates the two. This is
# not set near the middle of that gap: it is set low, because the case that actually
# needs a line is a scan the *publisher* has already auto-OCR'd badly, which yields a
# few hundred characters of noise that looks like a text layer and is not one. 2,000
# is roughly one dense page, which is below any real issue and above that noise.
#
# Moving it is a tuning decision. Too low and a bad publisher OCR is accepted as text
# and its notices are parsed out of garbage; too high and a thin but genuine issue is
# sent to Textract and billed for nothing. The route taken is recorded per bulletin,
# so which way it errs is measurable rather than a matter of opinion.
pdf_text_layer_min_chars: 2000

# The golden set: how many notices a person is asked to label, and how the draw is
# split across the free filter. Here rather than in monitor/golden.py because both
# numbers decide what the precision and recall figures at the week 14 gate actually
# measure, and changing either should carry a version history like every other
# threshold in this file (rule 6).
#
# `golden_set_size` is BUILD_ORDER step 21's 150, up from 30.
#
# `golden_passed_share` is how many of those come from notices the free filter LET
# THROUGH; the remainder are drawn from `filtered_out`. That split is the reason the
# set exists in its current form. Drawing only from survivors measures the scorer and
# is structurally blind to the filter: a relevant notice wrongly dropped on a CPV code
# or a missing lexicon phrase could never appear in the set and could never be counted
# as a miss. 1,904 of the 2,083 notices held on 2026-09-12 went that way - 91% of the
# corpus, unexamined. A label of `relevant` on the dropped side is a FILTER miss, a
# different defect with a different fix from a scorer miss, and a set that cannot tell
# the two apart can only ever find one of them.
#
# Do not read 90/60 as step 21's "60 relevant, 90 not". Those are label counts, which
# the labeller produces and nobody can set in advance; these are filter-status counts,
# which the draw sets. The numbers coincide and the axes do not.
golden_set_size: 150
golden_passed_share: 90
