# The record builder's defaults, from Architecture v0.4 appendix E.
#
# One file, so a BD change to a default is a config edit and not a code change
# (rule 6). monitor/stage/record.py reads this and invents nothing that is not here.
#
# Appendix E's categories: D derived from the notice or candidate and written with
# confidence; S a heuristic suggestion the reviewer sees and edits before approving;
# B BD judgement only, where the exporter writes the same placeholder the CRM
# already shows for an unfilled field and never guesses. Every B field below is a
# placeholder on purpose: an imported Monitor record should read like an early
# record a person started, not a machine's guess dressed up as fact.

# The literal strings the CRM already uses for an unfilled field. Never a database
# NULL that renders as blank with no explanation.
placeholders:
  tbd: "TBD"
  unknown: "Unknown"
  dash: "-"
  zero: 0

# Which figure goes in appendix E's single amount column. Migration 012/013 made
# the published amount and its currency the record (rule 9) and the USD figure a
# derivation stamped with the rate that produced it; appendix E has one amount
# column and one currency column, and Zoho's Opportunities module handles
# multi-currency records natively, so this is the one place that decision is made.
#
#   published (the default): Currency is the notice's own currency and Total
#     Opportunity Amount is the published figure, exactly as stated, all the way
#     to the CSV. Pricing Notes carries the USD derivation when one exists
#     ("... at 44.5483 UAH/USD, rate dated ...") or says plainly that no USD rate
#     covers the currency.
#   usd: Total Opportunity Amount is the converted figure with Currency "USD",
#     and Pricing Notes carries the published amount and its rate instead. Falls
#     back to `published` behaviour when no rate covers the currency, rather than
#     ever writing "USD 0" for a contract whose value is real but unconverted.
#
# monitor/stage/record.py validates this on every call and raises on anything
# else; it is a config choice for BD to make after a conversation, not a branch
# the code takes on its own (rule 1).
value_basis: published

# S fields: fixed defaults for every Monitor record, editable by the reviewer.
suggested:
  # Used only when the notice states no value at all, and when value_basis is
  # "usd" but no fx_rates row covers the currency (see value_for_basis).
  currency: "USD"
  probability_pct: 10
  pipeline: "Standard (Sales Opportunity)"
  standard_or_custom: "Standard (COTS)"
  delivery_model_default: "Direct"
  # Used instead when the candidate's cluster names a donor or partner source.
  delivery_model_partner_supported: "Direct (Partner-Supported)"
  customer_type_default: "New Customer"
  lead_source: "Monitor"
  proposal_type_default: "RFP (or similar)"
  partner_led_default: "No"

# Deal Tier by score band. Below stage_threshold nothing is staged, so there is no
# tier 3 row: a candidate that low never reaches a record.
deal_tier:
  tier_1_min_score: 85
  tier_1: "Tier 1"
  tier_2: "Tier 2"

# Level of Government, from the candidate's admin_level.
level_of_government:
  national: "Central"
  regional: "Local/Regional"
  local: "Local/Regional"
  donor: "Central"

# Industry, by the candidate's region. Only the West Africa value is stated in
# Architecture v0.4. The other two are picklist values held in the CRM and are not
# in the architecture or in the Ghana reference record, so they are placeholders
# until the step 16 dry-run import confirms them with the named import operator.
# A wrong picklist value is a rejected column at import; a placeholder is one
# mapping decision the operator makes once.
industry_by_region:
  West Africa: "North & West Africa"
  Balkans and Ukraine: "TBD"
  Europe: "TBD"
  default: "TBD"

# Funding Source, from the donor stream tag on the matched source. Anything with no
# donor source in its cluster is a government's own budget.
funding_source_by_stream:
  worldbank: "World Bank (IDA/IBRD)"
  afdb: "AfDB"
  eu: "EU"
  mcc: "MCC"
  isdb: "IsDB"
  boad: "BOAD"
  ebrd: "EBRD"
  undp: "UNDP"
  default: "Government budget"

# D fields whose text is a fixed sentence with values substituted in. Held here so
# the wording is a config change, not a code change.
sentences:
  eligibility_none_detected: "No eligibility barriers detected in the notice text."
  pricing_notes: "{funding_source}{project_id}; estimated value {value}. Monitor-estimated, unverified."
  # The three value cases a reviewer must be able to tell apart at a glance, read
  # by monitor/stage/record.py's value_narrative for the candidate page, the
  # queue list and (via pricing_value_note) Pricing Notes, so the three never say
  # three different things about the same candidate. amount and usd are bare
  # numbers formatted with thousands separators here only because these are
  # prose, not the CSV's amount column, which never carries one (rule 9).
  value_not_stated: "not stated"
  value_no_usd: "{currency} {amount:,.0f} (no USD rate held for {currency})"
  value_with_usd: "{currency} {amount:,.0f} ≈ USD {usd:,} at {rate:.4f} {currency}/USD, rate dated {rate_date}"
  # Used only when value_basis is "usd" and a USD figure exists: the amount
  # column already holds the conversion, so this carries the published figure
  # and its rate instead of restating the same USD number twice.
  value_usd_basis: "published as {currency} {amount:,.0f} at {rate:.4f} {currency}/USD, rate dated {rate_date}"
  next_steps: >-
    Approved by {reviewer} on {date}. Validate opportunity details; confirm the Account link;
    confirm funding source; register interest if required.
  account_name_proposal: "proposed: {buyer}"

# Eligibility flags that mean the reviewer has to register interest before bidding.
register_interest_flags: ["local_registration", "consortium_required"]

# The export column specification: Architecture v0.4 appendix E, in its order.
#
# One ordered list, read by monitor/stage/record.py to build a record and by
# review/export.py at step 11 to write the CSV header, so the record and the export
# cannot disagree about what a column is called or where it sits. Zoho's import
# mapper matches on headers, so the order and the spelling are the contract.
#
# category, from appendix E:
#   D  derived from the notice or candidate, written with confidence
#   S  a heuristic suggestion, written but expected to change; the reviewer sees it
#      in the record preview before approving and edits it there like any other field
#   B  BD judgement only. The exporter writes the same placeholder the CRM already
#      shows for an unfilled field and never guesses. 39 of the 73 columns are this,
#      which is the point: an imported Monitor record should read like an early
#      record a person started, not a machine's guess dressed up as fact.
#
# Generated from the appendix on 2026-09-12 and checked in; the three slash-joined
# rows in the document ("Licenses / Implementation Services / ...") are expanded
# into their individual columns here, which is what the CRM actually has.
columns:

  # Opportunity information
  - {name: "Opportunity Name", category: D}
  - {name: "Opportunity Owner", category: B}
  - {name: "Stage", category: S}
  - {name: "Closing Date", category: B}
  - {name: "Finance Project ID", category: D}
  - {name: "Account Name", category: S}
  - {name: "Is this a Partner or Reseller-led opportunity?", category: S}
  - {name: "Level of Government", category: D}
  - {name: "Sales Forecasting", category: B}
  - {name: "Proposal Type", category: S}
  - {name: "Original Closing Date", category: B}
  - {name: "Lead Source", category: S}
  - {name: "Partners Involved", category: D}
  - {name: "Pipeline", category: S}
  - {name: "Industry", category: D}
  - {name: "Shipping Country", category: D}
  - {name: "Funding Source", category: D}
  - {name: "Currency", category: S}

  # Deal classification
  - {name: "Deal Tier", category: S}
  - {name: "Delivery Model", category: S}
  - {name: "Expected Close Year", category: B}
  - {name: "Customer Type", category: S}

  # Eligibility requirements
  - {name: "Eligibility Requirements Met?", category: S}
  - {name: "Eligibility Requirements Comments", category: D}

  # Partner and legal information
  - {name: "Partner Required?", category: S}
  - {name: "Partner Required Comments", category: D}
  - {name: "Legal Support Required?", category: B}
  - {name: "Legal Support Comments", category: B}

  # Submission information
  - {name: "Expected Release of RFP/EOI?", category: S}
  - {name: "Proposal Due or Submitted", category: D}
  - {name: "Proposal Documents Received", category: B}
  - {name: "Pre-Bid Meeting", category: B}
  - {name: "Deadline for Questions", category: B}
  - {name: "Delivery Logistics and Visa Requirements", category: B}
  - {name: "Do we need to register our interest?", category: S}
  - {name: "Number of Copies?", category: B}
  - {name: "Is Bid Bond Required", category: B}
  - {name: "Format of Bid Bond", category: B}
  - {name: "Amount of Bid Bond (if known)", category: B}
  - {name: "Estimated Duration of Contract in Months", category: B}

  # Pricing summary
  - {name: "Licenses", category: B}
  - {name: "Implementation Services", category: B}
  - {name: "Software Maintenance", category: B}
  - {name: "Academy-Training", category: B}
  - {name: "Sustainability-Help Desk", category: B}
  - {name: "Third Party Licenses", category: B}
  - {name: "FreeBalance Amount", category: B}
  - {name: "Total Opportunity Amount", category: S}
  - {name: "Probability (%)", category: S}
  - {name: "Tax Amount", category: B}
  - {name: "Pricing Notes", category: D}

  # Hardware and products required
  - {name: "Hardware/Hosting", category: B}
  - {name: "Standard or Custom Product Required?", category: S}
  - {name: "FreeBalance Products Required", category: D}
  - {name: "Product Gaps", category: D}
  - {name: "Are gaps critical", category: B}
  - {name: "Mandatory Requirements", category: B}
  - {name: "Evaluation Weighting", category: B}
  - {name: "Do we pass the 80/20 rule?", category: B}
  - {name: "Third Party Software", category: B}
  - {name: "Hardware and Systems Software", category: B}
  - {name: "Level of Effort", category: B}

  # Implementation and pricing
  - {name: "Implementation Period", category: B}
