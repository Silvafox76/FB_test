  - {name: "Post-Warranty Period", category: B}
  - {name: "Budget Notes", category: B}

  # Additional information
  - {name: "Created By", category: D}
  - {name: "Next Steps", category: D}
  - {name: "monitor_candidate_id", category: D}
  - {name: "monitor_export_batch", category: D}
