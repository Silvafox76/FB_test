# French lexicon: function_id -> phrases matched case-insensitively on title + body.
# Same contract as lexicon_en.yaml. West Africa is 1.0 geography weight and largely
# francophone, so a gap here costs more than a gap in the English file. Seeded from the
# prototype; every miss found at step 19 becomes a case in filter_cases.yaml before it
# becomes a phrase here.
#
# `conformité` WAS REMOVED ON 2026-09-12. It was the single worst phrase in either lexicon:
# 14 of the 15 notices it matched passed on it alone, and every one was "mise en conformité"
# - French for bringing a building up to code. Fire safety at Beuvry, the filtration system
# of the Rambervillers swimming pool, accessibility works at the MUDAAC, drinking water at
# Aurillac. None is remotely PFM and the scorer agreed: best relevance 25, mean 8.
#
# `conformité réglementaire`, `contrôle de conformité` and `audit de conformité` replace it
# and carry the regulatory sense the function actually means. `SIRH` is added because it is
# the standard French acronym for an HR information system and it catches two real HRMIS
# tenders the lexicon was missing entirely.
#
# `trésor`, `recrutement` and `mutation` WERE REMOVED ON 2026-09-12, the same generic-word
# defect `conformité` had, found the same way. Measured on five Burkina Faso Quotidien
# issues (n4471, n4477, n4478, n4483, n4486; 284 tender notices, pdftotext -layout):
#
# `trésor` matched 59 times and not once in the treasury sense. Every hit was the payment
# office where a bidder buys the tender file - "à la Trésorerie Provinciale de Orodara",
# "la Trésorerie Régionale du Liptako", "payable à la trésorerie départementale de Sebba".
# That sentence is in substantially every West African tender notice, so the phrase would
# have passed the whole francophone West African corpus on boilerplate the moment one of
# those sources went live. It matches 0 notices in the corpus we hold today, so removing it
# costs nothing now and prevents a flood later. `comptabilité publique` replaces it and
# carries the sense the function means. It is deliberately ONE phrase, not two, and it is
# first in the list, because `monitor/score/prompt.py:_functions_block()` shows the model
# only the first six French phrases per function: a second replacement here pushed `SIGIF`
# out of that window, and SIGIF is one of the system names CLAUDE.md calls out as a strong
# signal. The deterministic filter in `monitor/filter/lexicon.py` reads the whole list, so
# list ORDER silently decides what the scorer sees and what the gate matches are not the
# same set. That asymmetry is pre-existing and is not fixed here; it is written down so the
# next person adding a phrase to a long function checks the sixth entry before committing.
# `compte unique du trésor` was NOT used: it already exists under `bank_cash_management`,
# where TSA belongs, and duplicating it across two functions with different pillars and type
# weights would tell the model one phrase signals both, which feeds `matched_functions` into
# appendix E's Products Required and Product Gaps.
#
# `recrutement` matched consultant hiring for air-quality monitoring, fibre-optic links,
# entrepreneurship training for 50 young people, environmental impact notices and a
# communications agency. `mutation` matched "mutation vers la technologie à diodes
# électroluminescentes" - a streetlight replacement. Neither is PFM.
#
# Recall cost of all three, measured against the 710 notices the fr lexicon reads: 2 lost,
# scoring 15 and 5, both false positives (a Belgian business-services catch-all listing
# "recrutement" among its services, and the LED streetlights). Nothing at or above the
# staging threshold moved. The one genuine PFM notice `recrutement` had been matching -
# "Recrutement d'un cabinet de conseil pour la Revue de la Qualité des Actifs (AQR)",
# relevance 25 - still passes, on `gouvernance`.
#
# What this leaves `civil_service_movement` is two phrases, `mouvement du personnel` and
# `nomination`, and both were measured too: each matches 0 of the 710 notices the fr lexicon
# reads, and 0 across the 284 Burkina notices. So the function matches nothing today. That is
# a deliberate choice of inert over noisy - `recrutement` was its only phrase that fired and
# every firing was a false positive - but it is a real gap, not a solved problem, and the
# honest next move is a filter_cases.yaml case from a genuine civil-service-movement notice
# rather than another guessed phrase. `nomination` in particular is generic enough (ministerial,
# judicial, board appointments) to be the next `trésor` the moment a source starts publishing
# appointment notices; it is kept only because it currently matches nothing to prove it wrong.
#
# TWELVE PHRASES WERE ADDED ON 2026-09-19, the French renderings of the PFM vocabulary taken
# from the "Mega Win Themes" document (see lexicon_en.yaml for the measurement and what was
# left out): comptabilité d'engagement, nomenclature budgétaire, comptabilité d'exercice,
# comptabilité patrimoniale, COFOG, statistiques de finances publiques, PEFA, gestion des
# dépenses publiques, budgétisation sensible au genre, budget vert, GRP, comptabilité par
# activités. Each matches zero of the notices the fr lexicon reads today (GRP: one, already
# passing). `renforcement des capacités`, `transfert de compétences` and `interopérabilité`
# were measured and left out: the two new passes each would bring are a complaints-management
# application and the Oùra ticketing system. Appended after the six-phrase window, so the
# scorer's French block is unchanged except where a function had fewer than six.
