# English lexicon: function_id -> phrases matched case-insensitively on title + body.
# The free filter (monitor/filter/lexicon.py) drops a notice that matches nothing here
# before any model call, so a missing phrase is a missed opportunity and an over-broad
# one is a wasted call. Seeded from the prototype's per-function keyword lists and the
# system-name list in CLAUDE.md; tuned against real notices at step 19.
#
# FOUR BARE WORDS WERE REMOVED ON 2026-09-12 AND THE MEASUREMENT IS THE REASON.
# `compliance`, `establishment`, `transfer` and `recruitment` were each, on their own, the
# only reason dozens of notices survived the filter: 26, 14, 20 and 15 notices respectively,
# out of the 151 that passed on a single phrase. They were not catching PFM. `compliance`
# sits in the administrative boilerplate of nearly every European notice; `establishment` is
# the ordinary gerund, as in "Establishment of a framework agreement"; `transfer` was data
# transfer and waste transfer stations; and `recruitment` matches inside the TED CPV-79
# heading "law, marketing, consulting, recruitment, printing and security", which TED
# prepends to the title of every notice in that class regardless of what is being bought.
# Across all four, the scorer's mean relevance was 11 to 19 out of 100.
#
# Three of them had, between them, caught two notices that scored 72 - and reading those two
# is what decided the shape of this change. `compliance` caught Finland's "Internal
# Accounting and Financial Management Software"; `establishment` caught Spain's framework
# for a municipal system covering "tax management, and assets, accounting and invoice
# registration". Both were accidents: the generic word appeared somewhere in the text while
# the actual PFM content sat in words the lexicon did not have. So they were not deleted,
# they were REPLACED - `financial management software`, `tax management` and
# `invoice registration` now catch those two notices deliberately, on their merits.
#
# Measured over the 1,703 notices the filter has read: 173 passed before, 101 after. Nothing
# that the scorer rated 60 or above is lost, and nothing in the 40-70 rescore band either;
# the highest-scoring notice that stops passing scored 35.
#
# WHAT WAS DELIBERATELY NOT REMOVED, because it is the same argument in the other direction.
# `risk management`, `asset management`, `purchasing`, `appointment`, `self-service` and
# `e-procurement` are all bare-ish words with poor sole matches too - but 3 to 5 notices
# each, not 14 to 26. At that volume the cost of keeping them is a couple of cents a pass,
# and each is genuine PFM vocabulary that would catch a real system tender. A false positive
# costs one cheap scorer call; a false negative loses an opportunity nobody ever sees. The
# bar for removal is therefore high, and low-volume noise does not clear it.
#
# The additions below marked as breadth exist for the opposite reason: `audit services`,
# `accounting services`, `financial audit`, `debt management`, `enterprise resource planning`
# and `ERP system` bring in public-sector audit and government ERP work that the lexicon was
# blind to - 16 notices on the current corpus, including Spain's audits of public sector
# entities and Latvia's EU fund certification. They are adjacent rather than core, which is
# what the lower staging threshold in thresholds.yaml is now there to let a person judge.
#
# FOURTEEN PHRASES WERE ADDED ON 2026-09-19 FROM THE "MEGA WIN THEMES" DOCUMENT (BD, December
# 2025), whose five themes each carry a "detection triggers" keyword list written for exactly
# this kind of filter. Every keyword in it, 67 in all, was measured against the 2,700 notices
# held (scratchpad measure_win_themes.py, same readable-text rule as measure_lexicon.py).
# What was taken: the PFM-specific vocabulary from themes 1 and 3 - commitment accounting,
# budget classification, accrual accounting, COFOG, government financial statistics, PEFA,
# public expenditure management, government resource planning, GRP, FMIS, results-based
# management, gender and climate budgeting, activity-based costing. Each matches ZERO notices
# today, so each costs nothing at the filter now and exists for the reform-programme and West
# African notices that write in this register (a PEFA-driven IFMIS tender does say PEFA).
# What was NOT taken, with the measurement: `configuration` (42 hits, 33 new passes, 2 golden
# relevant against 13 not - the decision-44 bare word again), `modernization` (20 new, school
# furniture and computer equipment, none relevant), `interoperability` (10, 2 against 3),
# `capacity building` (10, water and energy projects), `metadata` (publishing services), and
# every keyword in themes 2, 4 and 5 (sovereignty, TCO, cloud native, API-first, ...), which
# describe how FreeBalance sells rather than what a notice asks for. Themes and pain points
# are proposal material and do not go into the prompt: the scorer judges the notice.
# Placement: appended to each function's list, so `_functions_block()`'s window (first eight
# English phrases) still shows the model the phrases it was tuned on; the deterministic
# filter reads the whole list. prompt_version changes where a function was under the window.
